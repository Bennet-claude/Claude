  if(!all.length) return bar + `<div class="dk-gap">${empty('denken', 'Noch keine Entscheidung', 'Wichtige Entscheidungen durchdenken und später auswerten.', `<button class="btn primary" data-action="fab" data-form="decision">${ic('plus')}Entscheidung durchdenken</button>`)}</div>` + how;
  const due = all.filter(d => dkDecState(d, today) === 'due').sort((a, b) => a.reviewOn.localeCompare(b.reviewOn));
  const open = all.filter(d => dkDecState(d, today) === 'open').sort((a, b) => (a.reviewOn || '9999').localeCompare(b.reviewOn || '9999') || byNew(a, b));
  const done = all.filter(d => d.outcome).sort((a, b) => (b.reviewedAt || b.createdAt || '').localeCompare(a.reviewedAt || a.createdAt || ''));
  const dopen = S.open.has('dk-done'), p = paged('dk-done', done);
  const vc = {}; done.forEach(d => { if(d.verdict) vc[d.verdict] = (vc[d.verdict] || 0) + 1; });
  const vline = Object.keys(vc).length ? `<div class="dk-vline">${DK_VERDICT.filter(([k]) => vc[k]).map(([k, l]) => `<span class="pill${k === 'gut' ? ' ok' : k === 'anders' ? ' warn' : ''}">${esc(l)} · ${vc[k]}</span>`).join('')}</div>` : '';
  let html = bar + '<div class="dk-gap">';
  if(due.length) html += `<div class="group-h dk-gh-due">Jetzt auswerten <b>${due.length}</b></div><div class="list">${due.map(decisionCard).join('')}</div>`;
  if(open.length) html += `<div class="group-h">Offen <b>${open.length}</b></div><div class="list">${open.map(decisionCard).join('')}</div>`;
  if(!due.length && !open.length) html += `<div class="dk-none">${ic('check')}<span>Alles ausgewertet. Neue Entscheidung oben eintragen.</span></div>`;
  html += '</div>';
  if(done.length) html += dkFold('dk-done', 'Ausgewertet', done.length) + (dopen ? `<div id="dk_dk-done">${vline}<div class="list">${p.items.map(decisionCard).join('')}</div>${p.more}</div>` : '');
  return html + how;
}
function devilHTML(dv){

function decisionCard(d){
  const key = 'd-' + d.id, open = S.open.has(key), today = todayISO(), state = dkDecState(d, today);

  if(state === 'done'){ kick.push(`<span class="pill ok">${ic('check')}Ausgewertet</span>`); if(vd) kick.push(`<span class="pill${d.verdict === 'gut' ? ' acc' : d.verdict === 'anders' ? ' warn' : ''}">${esc(vd[1])}</span>`); }
  else if(state === 'due') kick.push(`<span class="pill warn">${ic('clock')}Auswerten fällig</span>`);
  else if(d.reviewOn) kick.push(`<span class="pill">${ic('calendar')}Auswerten ${esc(dkDate(d.reviewOn))}</span>`);

/* ---------------- Routinen ---------------- */
const mtPh = r => Array.isArray(r) && r.length ? r.filter(p => Array.isArray(p) && Array.isArray(p[1])).map(p => [String(p[0] || ''), p[1].map(String)]) : null;
/* Standard-Routinen (ROUTINES, eigene Änderungen in prefs.routines[key] als Abschnitts-Liste) und eigene Routinen
   (prefs.routines['c_…'] = {label, at, phases}). */
function mtRoutines(){
  const pr = prefs().routines || {};
  const out = Object.entries(ROUTINES).map(([key, r]) => { const own = mtPh(pr[key]); return {key, title:r.label, phases:own || r.phases, custom:false, modified:!!own}; });
  Object.entries(pr).filter(([k, v]) => k.startsWith('c_') && v && typeof v === 'object' && !Array.isArray(v) && v.label)
    .sort((a, b) => String(a[1].at || '').localeCompare(String(b[1].at || '')))
    .forEach(([key, v]) => out.push({key, title:String(v.label), phases:mtPh(v.phases) || [['Ablauf', []]], custom:true, modified:false}));
  return out;
}
const mtRoutine = key => { const all = mtRoutines(); return all.find(r => r.key === key) || all[0]; };
const mtKey = () => mtRoutine(S.f.routine || 'spieltag').key;
const mtTally = (phases, ck) => ({total:phases.reduce((n, p) => n + p[1].length, 0), done:phases.reduce((n, p, pi) => n + p[1].filter((_, i) => ck[pi + '-' + i]).length, 0)});
function mtParse(txt){
  const out = []; let cur = null;
  String(txt || '').split(/\r?\n/).forEach(raw => {
    const l = raw.trim().replace(/^[-–•*]\s*/, '').trim(); if(!l) return;
    if(l.length > 1 && l.endsWith(':')){ cur = [l.slice(0, -1).trim().slice(0, 40), []]; out.push(cur); return; }
    if(!cur){ cur = ['Ablauf', []]; out.push(cur); }
    cur[1].push(l.slice(0, 80));
  });
  return out.length ? out : [['Ablauf', []]];
}
const mtUnparse = phases => phases.length === 1 && phases[0][0] === 'Ablauf' ? phases[0][1].join('\n') : phases.map(([h, it]) => [h + ':', ...it].join('\n')).join('\n');
async function mtSaveRoutines(fn){
  const all = JSON.parse(JSON.stringify(prefs().routines || {})); fn(all);
  try{ await savePrefs({routines:all}); return true; }catch(e){ failed(e); return false; }
}

  return top
    + `<div class="panel routine mt-rt${total && done === total ? ' mt-full' : ''}"><div class="score-row"><b class="num">${done}/${total}</b><div class="meter"><i style="width:${total ? done / total * 100 : 0}%"></i></div><button class="btn sm ghost" data-action="rtReset"${done ? '' : ' disabled'}>${ic('refresh')}Neu starten</button></div>${phases}${foot}</div>`
    + `<div class="mt-gap">${how}</div>`;
}
function mtRtProgress(key, ck, justChecked){
  const r = mtRoutine(key), {total, done} = mtTally(r.phases, ck);
  const b = $('.mt-rt .score-row b'), m = $('.mt-rt .meter i'), rs = $('.mt-rt [data-action="rtReset"]'), panel = $('.mt-rt');
  if(b) b.textContent = done + '/' + total;
  if(m) m.style.width = (total ? done / total * 100 : 0) + '%';
  if(rs) rs.disabled = !done;
  r.phases.forEach(([, items], p) => { const pc = $(`.mt-rt [data-pc="${p}"]`); if(pc) pc.textContent = items.filter((_, i) => ck[p + '-' + i]).length + '/' + items.length; });
  if(panel) panel.classList.toggle('mt-full', !!total && done === total);
  if(justChecked && total && done === total){ FX.embers({left:0, top:innerHeight * .4, width:innerWidth, height:innerHeight * .6}, {n:70}); toast('Routine komplett. Du bist bereit.', 'trophy'); }
}
/* Beim Löschen eines Punkts rücken die Häkchen der folgenden Punkte nach. */
function mtShiftChecks(key, p, i){
  const ck = store.get('rt-' + key, {}) || {}, nk = {};
  Object.keys(ck).forEach(k => { const [a, b] = k.split('-').map(Number); if(a !== p || b < i) nk[k] = ck[k]; else if(b > i) nk[a + '-' + (b - 1)] = ck[k]; });
  store.set('rt-' + key, nk);
}
function mtArm(el, label, armedLabel, icon){
  if(el.classList.contains('armed')) return true;
  el.classList.add('armed', 'danger'); el.innerHTML = ic(icon) + armedLabel;
  setTimeout(() => { if(el.isConnected){ el.classList.remove('armed', 'danger'); el.innerHTML = ic(icon) + label; } }, 3000);
  return false;
}

/* Vorschläge für Prozessziele: kurz formuliert, jeweils aus einem Prinzip in LIB.fussball. */
const FB_GOALS = [
  ['Schulterblick vor jeder Annahme', 'Schulterblick vor der Annahme'],
  ['Halb offen anbieten', 'Offene Körperstellung'],
  ['Erster Kontakt nach vorn', 'Erster Kontakt mit Absicht'],
  ['Zwischen den Linien anbieten', 'Zwischen den Linien anbieten'],

  ['Dritten Mann suchen', 'Dritter Mann'],
  ['Verlagern, wenn es eng wird', 'Spielverlagerung'],
  ['Restverteidigung absichern', 'Restverteidigung'],
  ['Laut und früh coachen', 'Coaching und Kommunikation'],
  ['Spät in den Strafraum nachrücken', 'Box-to-Box mit Timing'],
  ['Mit Deckungsschatten anlaufen', 'Deckungsschatten']
].map(([t, lib]) => ({t, i:(LIB.fussball || []).findIndex(x => x.t === lib)})).filter(x => x.i >= 0);
/* Erkennt in eigenen Zielen das passende Prinzip (spezifische Muster zuerst). */
const FB_MATCH = [
  [/schulterblick|scann/, 'Schulterblick vor der Annahme'], [/zwischen den linien/, 'Zwischen den Linien anbieten'],
  [/gegenpress/, 'Gegenpressing'], [/dritte[nr]? mann/, 'Dritter Mann'], [/verlager/, 'Spielverlagerung'],
  [/deckungsschatten/, 'Deckungsschatten'], [/auslöser/, 'Pressing-Auslöser'], [/restverteid|absichern/, 'Restverteidigung'],
  [/zweikampf|stehen bleiben/, 'Zweikampf: stehen bleiben'], [/erste[rn]? kontakt/, 'Erster Kontakt mit Absicht'],
  [/strafraum|box-to-box/, 'Box-to-Box mit Timing'], [/coach|kommunik/, 'Coaching und Kommunikation'],
  [/offen anbieten|körperstellung|offen annehmen/, 'Offene Körperstellung'], [/spiel lesen|vorausdenken|voraus denken/, 'Spiel lesen']
].map(([rx, lib]) => ({rx, i:(LIB.fussball || []).findIndex(x => x.t === lib)})).filter(x => x.i >= 0);
const fbLibOf = text => { const s = String(text || '').toLowerCase(); const x = FB_MATCH.find(m => m.rx.test(s)); return x ? x.i : -1; };

const fbPlayed = () => S.matches.filter(m => m.status !== 'geplant');
const fbPlanned = () => S.matches.filter(m => m.status === 'geplant').sort((a, b) => (a.date || '').localeCompare(b.date || '') || byNew(b, a));
const fbNotes = () => { const types = AREA_NOTE_TYPES.fussball || []; return S.entries.filter(e => e.area === 'fussball' && (!e.type || e.type === 'notiz' || types.some(t => t[0] === e.type))); };
const fbByDate = (a, b) => (b.date || '').localeCompare(a.date || '') || byNew(a, b);
/* Ziele mit ihrem Index im gespeicherten Array (leere Einträge werden übersprungen). */
const fbGoalIdx = m => (Array.isArray(m.goals) ? m.goals : []).map((g, i) => ({g, i})).filter(o => o.g && String(o.g.text || '').trim());
const fbClean = arr => (Array.isArray(arr) ? arr : []).filter(g => g && String(g.text || '').trim()).map(g => ({text:String(g.text).trim().slice(0, 120), ok:!!g.ok})).slice(0, 3);
const fbComp = k => (COMPS.find(c => c[0] === k) || [0, ''])[1];
const fbPos = k => (POSITIONS.find(p => p[0] === k) || [0, ''])[1];
const fbTone = r => !r ? '' : r >= 8 ? ' good' : r <= 4 ? ' bad' : '';
const fbToast = (t, i) => setTimeout(() => toast(t, i), 60);
/* Volle Spiellänge aus den letzten Spielen (sonst 80), letzte Position, bisherige Gegner. */
function fbLen(){ const mx = Math.max(0, ...fbPlayed().sort(fbByDate).slice(0, 6).map(m => Number(m.minutes) || 0)); return mx >= 40 ? mx : 80; }
function fbLastPos(){ const m = fbPlayed().sort(fbByDate).find(x => x.position); return m ? m.position : '8'; }
function fbOpps(){ const seen = new Set(), out = []; [...S.matches].sort(fbByDate).forEach(m => { const o = String(m.opponent || '').trim(), k = o.toLowerCase(); if(o && !seen.has(k)){ seen.add(k); out.push(o); } }); return out.slice(0, 15); }
function fbGoalStats(list){
  const map = new Map();
  [...list].sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach(m => fbGoalIdx(m).forEach(({g}) => {
    const t = String(g.text).trim(), k = t.toLowerCase(), o = map.get(k) || {text:t, n:0, ok:0};
    o.n++; if(g.ok) o.ok++; o.text = t; map.set(k, o);
  }));
  return [...map.values()].sort((a, b) => b.n - a.n || b.ok / b.n - a.ok / a.n);
}
/* Vorschläge: deine häufigsten eigenen Ziele zuerst, dann die Prinzipien. */
function fbSuggest(n=6, skip=[]){
  const seen = new Set(skip.map(s => String(s).toLowerCase())), out = [];
  const add = t => { const k = t.toLowerCase(); if(!seen.has(k) && out.length < n){ seen.add(k); out.push(t); } };
  fbGoalStats(S.matches).filter(g => g.n >= 2 && g.text.length <= 36).slice(0, 2).forEach(g => add(g.text));
  FB_GOALS.forEach(x => add(x.t));
  return out;
}

function fbMatchesHTML(){
  if(!S.ready) return fbEntry() + `<div class="fb-gap">${loading()}</div>`;
  const played = fbPlayed().sort(fbByDate), planned = fbPlanned();
  if(!played.length && !planned.length) return empty('fussball', 'Noch keine Spiele', 'Trag ein Spiel nach dem Abpfiff ein oder setz dir vorher Prozessziele.', `<div class="fb-ebtns"><button class="btn primary" data-action="fab" data-form="match">${ic('plus')}Spiel eintragen</button><button class="btn" data-action="fab" data-form="matchPlan">${ic('calendar')}Spiel vorbereiten</button></div>`) + fbHow();
  let html = fbEntry();
  if(planned.length) html += `<div class="fb-gap fb-plans">${planned.map((m, k) => fbNextCard(m, k === 0)).join('')}</div>`;
  if(!played.length) return html + `<div class="fb-gap"><div class="fb-none">${ic('chart')}<span>Noch kein Spiel ausgewertet. Danach siehst du hier Note, Minuten und Verlauf.</span></div></div>` + fbHow();
  const rated = played.filter(m => m.rating);
  html += `<div class="fb-gap">${fbStats(played)}</div>`;
  if(rated.length >= 2) html += ratingChart(rated.slice(0, 12).reverse());
  /* Liste: Filter nach Wettbewerb (nur wenn mehrere genutzt), gruppiert nach Monat */
  const comps = COMPS.filter(([k]) => played.some(m => m.comp === k));
  const fc = comps.some(([k]) => k === S.f.fbComp) ? S.f.fbComp : 'alle';
  const counts = {alle:played.length}; comps.forEach(([k]) => { counts[k] = played.filter(m => m.comp === k).length; });
  const L = fc === 'alle' ? played : played.filter(m => m.comp === fc), p = paged('fb-m', L, 10);
  const mon = d => d ? parseISO(d).toLocaleDateString('de-DE', {month:'long', year:'numeric'}) : 'Ohne Datum';
  let list = '', cur = null;
  p.items.forEach(m => {
    const k = (m.date || '').slice(0, 7);
    if(k !== cur){ if(cur !== null) list += '</div>'; cur = k; list += `<div class="group-h">${esc(mon(m.date))} <b>${L.filter(x => (x.date || '').slice(0, 7) === k).length}</b></div><div class="list">`; }
    list += fbCard(m);
  });
  if(cur !== null) list += '</div>';
  html += `<div class="fb-list">${comps.length > 1 ? `<div class="toolbar fb-tools">${chipRow('fbComp', [['alle','Alle'], ...comps], fc, counts)}</div>` : ''}${list}${p.more}</div>`;
  return html + fbHow();
}

function fbStats(list){
  const rated = list.filter(m => m.rating), avg = rated.length ? rated.reduce((s, m) => s + Number(m.rating), 0) / rated.length : null;
  const mins = list.reduce((s, m) => s + (Number(m.minutes) || 0), 0);
  const goals = list.flatMap(m => fbGoalIdx(m).map(o => o.g)), ok = goals.filter(g => g.ok).length, gp = goals.length ? Math.round(ok / goals.length * 100) : null;
  const open = goals.length && S.open.has('fb-gstat');
  const gcell = goals.length
    ? `<button type="button" data-action="fbGStat" aria-expanded="${!!open}" aria-controls="fb_gt"><b>${gp}<small> %</small></b><span>Ziele umgesetzt${ic('chev', 2.2)}</span></button>`
    : `<div><b>–</b><span>Ziele umgesetzt</span></div>`;
  return `<div class="fb-stats"><div><b>${list.length}</b><span>${plural(list.length, 'Spiel', 'Spiele')}</span></div><div><b class="${fbTone(avg ? Math.round(avg) : 0).trim()}">${avg == null ? '–' : de(avg, 1)}</b><span>Ø Note</span></div><div><b>${de(mins)}</b><span>Minuten</span></div>${gcell}</div>${open ? fbGoalTable(list) : ''}`;
}
function fbGoalTable(list){
  const st = fbGoalStats(list).slice(0, 6);
  return `<div class="fb-gt" id="fb_gt"><div class="fb-gt-h"><span>Prozessziel</span><span>umgesetzt</span></div>${st.map(g => { const p = Math.round(g.ok / g.n * 100); return `<div class="fb-gr"><span class="t">${esc(g.text)}</span><span class="m"><span class="meter"><i style="width:${p}%"></i></span><b>${g.ok}/${g.n}</b></span></div>`; }).join('')}</div>`;
}

/* „Nächstes Spiel“: vorbereitetes Spiel mit Prozesszielen, direkt ergänzbar, und Knopf zum Auswerten. */
function fbNextCard(m, first){

  const cal = `<span class="fb-cal" aria-hidden="true"><small>${esc(wdShort(d))}</small><b>${dt.getDate()}</b><small>${esc(dt.toLocaleDateString('de-DE', {month:'short'}).replace('.', ''))}</small></span>`;
  const eb = late ? `<span class="eyebrow fb-late">Noch auswerten · ${esc(relDay(d))}</span>` : `<span class="eyebrow">${first ? 'Nächstes Spiel' : 'Geplant'} · ${esc(relDay(d))}</span>`;
  const meta = [fbComp(m.comp), m.time ? m.time + ' Uhr' : ''].filter(Boolean).join(' · ');
  const list = gs.length ? `<ol class="fb-pg">${gs.map((o, k) => `<li><span class="n">${k + 1}</span><span class="l">${esc(o.g.text)}</span>${fbLibOf(o.g.text) >= 0 && wissenOn() ? `<button class="fb-pgi" type="button" data-action="fbLib" data-i="${fbLibOf(o.g.text)}" aria-label="Prinzip im Wissen ansehen">${ic('book')}</button>` : ''}<button class="del" type="button" data-action="fbGoalDel" data-id="${m.id}" data-i="${o.i}" aria-label="Ziel entfernen">${ic('x')}</button></li>`).join('')}</ol>` : '';
  const add = gs.length < 3 ? `<div class="fb-add"><input class="txt" id="fb_g_${m.id}" placeholder="${gs.length ? 'Weiteres Prozessziel' : 'Eigenes Prozessziel'}" maxlength="80" autocomplete="off" enterkeyhint="done" data-enter="fbGoalIn" data-id="${m.id}" aria-label="Prozessziel hinzufügen"><button class="icon-btn sm" type="button" data-action="fbGoalIn" data-id="${m.id}" aria-label="Prozessziel hinzufügen">${ic('plus', 2.2)}</button></div><div class="fb-sugg">${fbSuggest(4, gs.map(o => o.g.text)).map(t => `<button type="button" class="chip sm" data-action="fbGoalAdd" data-id="${m.id}" data-v="${esc(t)}">${ic('plus', 2.4)}<span>${esc(t)}</span></button>`).join('')}</div>` : '';
  return `<section class="fb-next${late ? ' late' : ''}${freshCls('matches', m.id)}" data-row="${m.id}">
    <div class="fb-next-h">${cal}<div class="ct">${eb}<h4>gegen ${esc(m.opponent || '–')}</h4>${meta ? `<span class="fb-meta">${esc(meta)}</span>` : ''}</div></div>
    <div class="fb-pg-w"><div class="fb-pg-h">Prozessziele <b>${gs.length}/3</b></div>${list}${add}</div>
    <div class="actions"><button class="btn sm${n <= 0 ? ' primary' : ''}" data-action="fbEval" data-id="${m.id}">${ic('check', 2.2)}Auswerten</button><button class="btn sm" data-action="edit" data-form="matchPlan" data-col="matches" data-id="${m.id}">${ic('edit')}Bearbeiten</button><button class="btn sm ghost" data-action="del" data-col="matches" data-id="${m.id}" aria-label="Geplantes Spiel löschen">${ic('trash')}</button></div>
  </section>`;
}

function fbCard(m){
  const key = 'm-' + m.id, open = S.open.has(key), gs = fbGoalIdx(m), ok = gs.filter(o => o.g.ok).length;
  const comp = fbComp(m.comp), pos = fbPos(m.position);
  const kick = [`<span>${esc(m.date ? fmtDay(m.date) : 'Ohne Datum')}</span>`];
  if(comp) kick.push(`<span class="pill">${esc(comp)}</span>`);
  if(pos) kick.push(`<span class="faint">${esc(pos)}</span>`);
  kick.push(`<span class="faint">${Number(m.minutes) || 0} Min</span>`);
  const dots = gs.length ? `<span class="fb-gl"><span class="fb-dots" aria-hidden="true">${gs.map(o => `<i class="${o.g.ok ? 'on' : ''}"></i>`).join('')}</span>${ok} von ${gs.length} ${plural(gs.length, 'Prozessziel', 'Prozesszielen')}</span>` : '';
  const goals = gs.length ? blk('Prozessziele', `<div class="applied">${gs.map(o => `<button class="chk fb-gchk" type="button" data-action="fbGoalTog" data-id="${m.id}" data-i="${o.i}" aria-pressed="${!!o.g.ok}"><span class="box">${ic('check', 3)}</span><span class="l">${esc(o.g.text)}</span></button>`).join('')}</div>`) : '';
  const links = fbLinks(gs.map(o => o.g.text));
  const notes = (m.good ? blk('Lief gut', `<p>${esc(m.good)}</p>`) : '') + (m.improve ? blk('Verbessern', `<p>${esc(m.improve)}</p>`) : '') + (m.coach ? `<div class="example"><b>Trainer</b>${esc(m.coach)}</div>` : '');
  const bare = !gs.length && !m.good && !m.improve && !m.coach ? `<p class="fb-thin">Noch keine Details. Über „Bearbeiten“ ergänzt du Prozessziele und Notizen.</p>` : '';
  return `<article class="card fb-card${open ? ' open' : ''}${freshCls('matches', m.id)}" data-key="${key}"><button class="card-h" data-action="card" aria-expanded="${open}"><span class="rate fb-rate${fbTone(m.rating)}">${m.rating || '–'}</span><span class="ct"><span class="kick">${kick.join('')}</span><span class="h">gegen ${esc(m.opponent || '–')}${m.result ? ` <span class="fb-res">${esc(m.result)}</span>` : ''}</span>${dots}</span><span class="chev">${ic('chev', 2)}</span></button>
    <div class="card-b"><div><div class="inner">${goals}${links}${notes}${bare}<div class="actions"><button class="btn sm" data-action="edit" data-form="match" data-col="matches" data-id="${m.id}">${ic('edit')}Bearbeiten</button><button class="btn sm ghost" data-action="del" data-col="matches" data-id="${m.id}">${ic('trash')}Löschen</button></div></div></div></div></article>`;
}
function fbLinks(texts){
  if(!wissenOn()) return '';
  const idx = [...new Set(texts.map(fbLibOf).filter(i => i >= 0))].slice(0, 3);
  return idx.length ? `<div class="fb-links">${idx.map(i => `<button class="fb-link" type="button" data-action="fbLib" data-i="${i}">${ic('book')}<span>Prinzip: <b>${esc(LIB.fussball[i].t)}</b></span></button>`).join('')}</div>` : '';
}

async function fbAddGoal(id, text, el){
  const m = find('matches', id); if(!m) return;
  const goals = fbClean(m.goals), t = String(text || '').trim().slice(0, 80); if(!t) return;
  if(goals.length >= 3){ shake(el); toast('Höchstens drei Prozessziele', 'info'); return; }
  if(goals.some(g => g.text.toLowerCase() === t.toLowerCase())){ shake(el); return; }
  goals.push({text:t, ok:false});
  if(el){ const r = el.getBoundingClientRect(); FX.burst(r.left + Math.min(r.width / 2, 40), r.top + r.height / 2, {n:12, speed:4, ring:20}); }
  try{ await dbUpd('matches', id, {goals}); }catch(e){ failed(e); }
}

    <div class="card-b"><div><div class="inner"><div class="copybox" id="pt_${esc(p.id)}">${esc(p.text)}</div>${p.fields && p.fields.why ? howTo('Warum er funktioniert', `<p>${esc(p.fields.why)}</p>`) : ''}

}
function promptsHTML(){

  const add = `<div class="actions" style="margin-top:0"><button class="btn primary" data-action="fab" data-form="prompt">${ic('plus')}Prompt speichern</button><button class="btn" data-action="kiTpl">${ic('book')}Aus Vorlage</button></div>`;

}

const LB_WORDS = {
  out:{fussball:/fußball|fussball|verein|trikot|stollen|schienbein|stutzen|torwart|ball\b|training/i, essen:/döner|pizza|essen|snack|mensa|bäcker|mcdonald|burger|eis\b|trinken|getränk|kiosk|supermarkt/i, kleidung:/schuh|hose|shirt|jacke|pulli|kleid|socken/i, technik:/handy|kabel|kopfhörer|laptop|pc|konsole|spiel|game|app/i, freizeit:/kino|bowling|freizeitpark|konzert|ausflug|bahn|bus|ticket/i, abos:/abo|spotify|netflix|prime|disney|youtube|chatgpt|claude/i},

function parseTxn(raw){
  let s = raw.trim(), type = 'out';
  if(/^\+/.test(s)){ type = 'in'; s = s.slice(1).trim(); }
  else if(/^-/.test(s)) s = s.slice(1).trim();
  const m = s.match(/(\d{1,3}(?:\.\d{3})*(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)\s*(?:€|eur|euro)?/i);
  if(!m) return null;
  const amount = money(m[1]); if(!(amount > 0)) return null;
  const note = (s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length)).replace(/\s+/g, ' ').trim();
  if(type === 'out' && LB_WORDS.in.taschengeld.test(note) || /\b(bekommen|erhalten|verdient)\b/i.test(note)) type = 'in';
  const cat = (Object.entries(LB_WORDS[type]).find(([, re]) => re.test(note)) || ['sonst'])[0];
  return {type, amount, note, cat};
}

/* =====================================================================

const CH = {}; let chId = 0;
function chart(spec){ const id = 'c' + (++chId); CH[id] = spec; return `<div class="cv" data-chart="${id}" style="min-height:${spec.h || 200}px"></div>`; }
function drawCharts(root=document){
  const live = new Set();
  $$('.cv[data-chart]', root).forEach(el => {
    const id = el.dataset.chart, spec = CH[id]; live.add(id); if(!spec) return;
    const w = Math.max(240, el.clientWidth || 320);
    try{ el.innerHTML = DRAW[spec.type](spec, w); }catch(e){ console.error(e); }
  });
  if(root === document) Object.keys(CH).forEach(k => { if(!live.has(k)) delete CH[k]; });
}
addEventListener('resize', debounce(() => drawCharts(), 160));
function niceTicks(max, count=4){
  const raw = max / count, mag = Math.pow(10, Math.floor(Math.log10(raw || 1))), n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  const out = []; for(let v = 0; v <= max + step * .001; v += step) out.push(+v.toFixed(6));
  return out;
}
const compact = v => v >= 1e6 ? de(v / 1e6, 1) + ' Mio.' : v >= 1e3 ? de(v / 1e3, v >= 1e4 ? 0 : 1) + ' Tsd.' : de(v);
function tableTwin(head, rows){
  return `<details class="tbl"><summary>Als Tabelle</summary><div class="tw"><table class="t"><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
}
const DRAW = {
  lines(s, W){
    const H = s.h || 200, pl = 28, pr = 14, pt = 14, pb = 26, n = s.days.length, iw = W - pl - pr, ih = H - pt - pb;
    const x = i => pl + (n <= 1 ? iw / 2 : i * iw / (n - 1));
    const y = v => pt + ih - (v - s.yMin) / (s.yMax - s.yMin) * ih;
    let g = '';
    s.yTicks.forEach(t => { g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl - 8}" y="${y(t) + 3.5}" text-anchor="end">${t}</text>`; });
    const step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 58))));
    s.days.forEach((d, i) => { if((i % step === 0 && (n - 1 - i >= step || i === n - 1)) || i === n - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 && n > 1 ? 'start' : i === n - 1 && n > 1 ? 'end' : 'middle'}">${esc(s.xfmt ? s.xfmt(d) : d)}</text>`; });
    s.series.forEach(se => {
      const segs = []; let cur = [];
      se.values.forEach((v, i) => { if(v == null || isNaN(v)){ if(cur.length) segs.push(cur); cur = []; } else cur.push([x(i), y(v)]); });
      if(cur.length) segs.push(cur);
      segs.forEach(sg => {
        if(sg.length === 1){ g += `<circle cx="${sg[0][0]}" cy="${sg[0][1]}" r="3" fill="${se.color}"/>`; return; }
        const d = sg.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
        if(se.fill) g += `<path d="${d} L${sg[sg.length - 1][0].toFixed(1)} ${pt + ih} L${sg[0][0].toFixed(1)} ${pt + ih} Z" fill="${se.color}" opacity=".1"/>`;
        g += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      });
      let li = se.values.length - 1; while(li >= 0 && (se.values[li] == null || isNaN(se.values[li]))) li--;
      if(li >= 0) g += `<circle cx="${x(li)}" cy="${y(se.values[li])}" r="4.5" fill="${se.color}" style="stroke:var(--surface)" stroke-width="2"/>`;
    });
    const cw = n <= 1 ? iw : iw / (n - 1);
    s.days.forEach((d, i) => {
      const tip = [s.tipHead ? s.tipHead(d) : d, ...s.series.map(se => `${se.color}~${se.name}: ${se.values[i] == null || isNaN(se.values[i]) ? 'kein Eintrag' : (se.fmt ? se.fmt(se.values[i]) : se.values[i])}`)].join('|');
      g += `<rect class="hit" x="${(x(i) - cw / 2).toFixed(1)}" y="${pt}" width="${cw.toFixed(1)}" height="${ih}" data-tip="${esc(tip)}"/><line class="hl" x1="${x(i)}" x2="${x(i)}" y1="${pt}" y2="${pt + ih}" style="stroke:var(--line-strong)" stroke-width="1"/>`;
    });
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.label || '')}">${g}</svg>`;
  },
  bars(s, W){
    const H = s.h || 180, pl = 34, pr = 10, pt = 16, pb = 26, n = s.values.length, iw = W - pl - pr, ih = H - pt - pb;
    const vmax = Math.max(1, ...s.values.filter(v => v != null), s.band ? s.band[1] : 0);
    const ticks = s.yTicks || niceTicks(vmax * 1.1), max = s.yMax || ticks[ticks.length - 1] || vmax;
    const y = v => pt + ih - v / max * ih, slot = iw / n, bw = Math.min(24, slot * .64);
    let g = '';
    ticks.forEach(t => { g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl - 8}" y="${y(t) + 3.5}" text-anchor="end">${esc(s.tfmt ? s.tfmt(t) : t)}</text>`; });
    if(s.band){ const [lo, hi, lab] = s.band; g += `<rect x="${pl}" y="${y(hi)}" width="${iw}" height="${Math.max(0, y(lo) - y(hi))}" fill="#7ACB86" opacity=".09"/><text x="${W - pr}" y="${y(hi) - 5}" text-anchor="end">${esc(lab)}</text>`; }
    const step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 40))));
    s.values.forEach((v, i) => {
      const cx = pl + slot * i + slot / 2, hiOn = s.hi ? s.hi(i) : true;
      if(v != null && v > 0){
        const h = Math.max(2, pt + ih - y(v)), r = Math.min(4, bw / 2, h), bx = cx - bw / 2, by = pt + ih - h;
        g += `<path d="M${bx} ${by + h} V${by + r} Q${bx} ${by} ${bx + r} ${by} H${bx + bw - r} Q${bx + bw} ${by} ${bx + bw} ${by + r} V${by + h} Z" fill="${s.color}" opacity="${hiOn ? 1 : .62}"/>`;
        if(s.labelLast && i === n - 1) g += `<text x="${cx}" y="${by - 6}" text-anchor="middle" style="fill:var(--text);font-weight:600">${esc(s.fmt ? s.fmt(v) : v)}</text>`;
      }
      if((i % step === 0 && n - 1 - i >= step) || i === n - 1) g += `<text x="${cx}" y="${H - 6}" text-anchor="middle">${esc(s.labels[i])}</text>`;
      g += `<rect class="hit" x="${(pl + slot * i).toFixed(1)}" y="${pt}" width="${slot.toFixed(1)}" height="${ih}" data-tip="${esc((s.tips ? s.tips[i] : s.labels[i]) + '|' + s.color + '~' + (v == null ? 'kein Eintrag' : (s.fmt ? s.fmt(v) : v)))}"/><rect class="hl" x="${(pl + slot * i + 1).toFixed(1)}" y="${pt}" width="${(slot - 2).toFixed(1)}" height="${ih}" rx="6" style="fill:var(--wash)"/>`;
    });
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.label || '')}">${g}</svg>`;
  },
  heat(s, W){
    const n = s.days.length, labW = Math.min(170, Math.max(104, W * .34)), gap = 3;
    const cell = Math.max(10, Math.min(22, Math.floor((W - labW) / n) - gap));
    const totalW = Math.max(W, labW + n * (cell + gap)), H = s.rows.length * (cell + gap) + 22;
    let g = '';
    s.rows.forEach((r, ri) => {
      const yy = ri * (cell + gap);
      g += `<text x="0" y="${yy + cell / 2 + 4}" style="font-family:var(--sans);font-size:12px;fill:var(--muted)">${esc(cut(r.label, Math.floor(labW / 7.2)))}</text>`;
      r.cells.forEach((c, ci) => {
        const xx = labW + ci * (cell + gap), tip = `${fmtDay(s.days[ci])}|${c === true ? s.color : ''}~${esc(r.label)}: ${c === true ? 'geschafft' : c === false ? 'nicht geschafft' : 'kein Bericht'}`;
        g += c == null
          ? `<rect x="${xx + .5}" y="${yy + .5}" width="${cell - 1}" height="${cell - 1}" rx="${Math.min(4, cell / 3)}" fill="none" style="stroke:var(--surface-3)" data-tip="${esc(tip)}"/>`
          : `<rect x="${xx}" y="${yy}" width="${cell}" height="${cell}" rx="${Math.min(4, cell / 3)}" ${c ? `fill="${s.color}"` : 'style="fill:var(--surface-3)"'} data-tip="${esc(tip)}"/>`;
      });
    });
    const by = s.rows.length * (cell + gap) + 14;
    [[0, 'start'], [Math.floor((n - 1) / 2), 'middle'], [n - 1, 'end']].forEach(([i, a]) => { if(n > i) g += `<text x="${labW + i * (cell + gap) + (a === 'end' ? cell : a === 'middle' ? cell / 2 : 0)}" y="${by}" text-anchor="${a}">${esc(fmtShort(s.days[i]))}</text>`; });
    return `<svg width="${totalW}" height="${H}" viewBox="0 0 ${totalW} ${H}" role="img" aria-label="${esc(s.label || '')}">${g}</svg>`;
  },
  area(s, W){
    const H = s.h || 220, pl = 58, pr = 14, pt = 16, pb = 26, n = s.xs.length, iw = W - pl - pr, ih = H - pt - pb;
    const ticks = niceTicks(Math.max(...s.top) * 1.05), max = ticks[ticks.length - 1];
    const x = i => pl + (n <= 1 ? iw / 2 : i * iw / (n - 1)), y = v => pt + ih - v / max * ih;
    let g = '';
    ticks.forEach(t => { g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text x="${pl - 8}" y="${y(t) + 3.5}" text-anchor="end">${esc(compact(t))}</text>`; });
    const line = arr => arr.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
    const back = arr => arr.map((v, i) => [x(i), y(v)]).reverse().map(p => 'L' + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    g += `<path d="${line(s.base)} L${x(n - 1).toFixed(1)} ${pt + ih} L${x(0).toFixed(1)} ${pt + ih} Z" fill="#3F8FDE" opacity=".18"/>`;
    g += `<path d="${line(s.top)} ${back(s.base)} Z" fill="#E8691F" opacity=".16"/>`;
    g += `<path d="${line(s.base)}" fill="none" stroke="#3F8FDE" stroke-width="2" stroke-linejoin="round"/><path d="${line(s.top)}" fill="none" stroke="#E8691F" stroke-width="2" stroke-linejoin="round"/>`;
    g += `<circle cx="${x(n - 1)}" cy="${y(s.top[n - 1])}" r="4.5" fill="#E8691F" style="stroke:var(--surface)" stroke-width="2"/>`;
    const step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 46))));
    s.xs.forEach((xv, i) => { if(i % step === step - 1 || i === n - 1 || i === 0) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${xv} J.</text>`; });
    const cw = n <= 1 ? iw : iw / (n - 1);
    s.xs.forEach((xv, i) => { g += `<rect class="hit" x="${(x(i) - cw / 2).toFixed(1)}" y="${pt}" width="${cw.toFixed(1)}" height="${ih}" data-tip="${esc(`Nach ${xv} ${plural(xv, 'Jahr', 'Jahren')}|#3F8FDE~Eingezahlt: ${euro(s.base[i])}|#E8691F~Ertrag: ${euro(s.top[i] - s.base[i])}|~Gesamt: ${euro(s.top[i])}`)}"/><line class="hl" x1="${x(i)}" x2="${x(i)}" y1="${pt}" y2="${pt + ih}" style="stroke:var(--line-strong)"/>`; });
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.label || '')}">${g}</svg>`;
  }
};

/* =====================================================================
   FOKUS-TIMER
   ===================================================================== */
const FT = (() => {
  let st = Object.assign({dur:25*60, remain:25*60, start:null, running:false, label:'', mode:'focus', lastFocus:25*60}, store.get('ft', {}));
  let tmr = 0, wake = null, actx = null;
  const C = 2 * Math.PI * 112;
  const save = () => store.set('ft', st);
  const left = () => st.running ? Math.max(0, st.remain - (Date.now() - st.start) / 1000) : st.remain;
  const fmt = s => { s = Math.ceil(s); const m = Math.floor(s / 60), r = s % 60; return (m >= 60 ? Math.floor(m / 60) + ':' + pad(m % 60) : pad(m)) + ':' + pad(r); };
  function weekBars(){
    const today = todayISO(), days = Array.from({length:7}, (_, i) => addDays(today, i - 6));
    const vals = days.map(d => { const x = S.focus.find(f => f.id === d); return x ? x.minutes || 0 : 0; });
    return `<figure class="chart"><figcaption><strong>Fokusminuten</strong><span>letzte 7 Tage · ${vals.reduce((a, b) => a + b, 0)} Min</span></figcaption>${chart({type:'bars', h:170, labels:days.map(wdShort), tips:days.map(fmtDay), values:vals, color:'#E8691F', fmt:v => v + ' Min', labelLast:true, label:'Fokusminuten der letzten 7 Tage'})}${tableTwin(['Tag', 'Minuten'], days.map((d, i) => [fmtDay(d), vals[i]]))}</figure>`;
  }
  function html(){
    const l = left(), today = S.focus.find(f => f.id === todayISO()), mins = today ? today.minutes || 0 : 0, n = today && today.sessions ? today.sessions.length : 0;
    const ticks = Array.from({length:60}, (_, i) => { const a = i / 60 * Math.PI * 2, r1 = i % 5 ? 124 : 121, r2 = 128; return `<line x1="${130 + Math.cos(a) * r1}" y1="${130 + Math.sin(a) * r1}" x2="${130 + Math.cos(a) * r2}" y2="${130 + Math.sin(a) * r2}"/>`; }).join('');
    const idle = !st.running && l >= st.dur - .5;
    return `<div class="timer${st.running ? ' run' : ''}" id="ftBox">
      <div class="t-ring"><svg viewBox="0 0 260 260" aria-hidden="true"><g class="ticks">${ticks}</g><circle class="trk" cx="130" cy="130" r="112"/><circle class="prg" id="ftPrg" cx="130" cy="130" r="112" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (l / st.dur)).toFixed(1)}"/></svg>
        <div class="t-mid"><b id="ftTime" aria-live="off">${fmt(l)}</b><span id="ftSub">${st.mode === 'break' ? 'Pause: bewegen, trinken, kein Handy' : esc(st.label || 'Fokusblock')}</span></div></div>
      ${idle && st.mode === 'focus' ? `<div class="t-set"><div class="chips wrapy" style="justify-content:center">${[15, 25, 40, 50, 90].map(m => `<button class="chip" data-action="ftDur" data-v="${m}" aria-pressed="${st.dur === m * 60}">${m} Min</button>`).join('')}</div><input class="txt" id="ftLabel" placeholder="Woran arbeitest du? z. B. Mathe Aufgaben S. 54" value="${esc(st.label)}" data-change="ftLabel" autocomplete="off" style="text-align:center"></div>` : ''}
      <div class="t-ctl">${st.running
        ? `<button class="btn lg" data-action="ftPause">${ic('pause', 2.2)}Pause</button><button class="btn lg ghost" data-action="ftStop">${ic('stop')}Beenden</button>`
        : idle ? `<button class="btn lg primary" data-action="ftStart">${ic('play')}${st.mode === 'break' ? 'Pause starten' : 'Fokus starten'}</button>${st.mode === 'break' ? `<button class="btn lg ghost" data-action="ftSkip">Pause überspringen</button>` : ''}`
        : `<button class="btn lg primary" data-action="ftStart">${ic('play')}Weiter</button><button class="btn lg ghost" data-action="ftStop">${ic('stop')}Beenden</button>`}</div>
    </div>
    <div class="stats" style="margin-top:12px"><div class="st"><span>Heute</span><b>${mins}<small>Min</small></b></div><div class="st"><span>Blöcke heute</span><b>${n}</b></div><div class="st"><span>Diese Woche</span><b>${weekMinutes()}<small>Min</small></b></div><div class="st"><span>Tage mit Fokus</span><b>${focusStreak()}<small>in Folge</small></b></div></div>
    ${weekBars()}
    <p class="note">Der Timer läuft weiter, wenn du den Bereich wechselst. Ein Block zählt, sobald er vollständig ist. Brichst du nach mindestens 5 Minuten ab, wird die Zeit trotzdem gespeichert.</p>`;
  }
  function paint(){
    const l = left(), t = $('#ftTime'), p = $('#ftPrg');
    if(t) t.textContent = fmt(l);
    if(p) p.style.strokeDashoffset = (C * (l / st.dur)).toFixed(1);
    if(st.running && l <= 0){ complete(); return; }
    clearTimeout(tmr);
    if(st.running && t) tmr = setTimeout(paint, 500);
  }
  function chime(){
    try{
      if(!actx) return;
      const now = actx.currentTime;
      [[659.25, 0], [880, .18], [1318.5, .36]].forEach(([f, d]) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0, now + d); g.gain.linearRampToValueAtTime(.18, now + d + .02); g.gain.exponentialRampToValueAtTime(.0001, now + d + 1.2); o.connect(g).connect(actx.destination); o.start(now + d); o.stop(now + d + 1.3); });
    }catch(e){}
  }
  async function lock(on){ try{ if(on && navigator.wakeLock && !wake) wake = await navigator.wakeLock.request('screen'); if(!on && wake){ await wake.release(); wake = null; } }catch(e){ wake = null; } }
  async function logMinutes(min){
    if(min < 1) return;
    const id = todayISO(), doc = S.focus.find(d => d.id === id);
    const sessions = [...((doc && doc.sessions) || []), {min, label:st.label || '', at:nowISO()}].slice(-40);
    try{ await dbSet('focus', id, {date:id, minutes:((doc && doc.minutes) || 0) + min, sessions}); }catch(e){ failed(e); }
  }
  let completing = false;
  async function complete(){
    if(completing) return; completing = true;
    clearTimeout(tmr); lock(false); chime();
    if(st.mode === 'focus'){
      const min = Math.round(st.dur / 60);
      st.running = false; st.lastFocus = st.dur; st.mode = 'break'; st.dur = st.remain = (min >= 50 ? 10 : 5) * 60; st.start = null; save();
      await logMinutes(min);
      toast(`Fokusblock geschafft: ${min} Minuten`, 'trophy');
      const b = $('.t-ring'); if(b){ const r = b.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + r.height / 2, {n:48, speed:8, life:1200, ring:r.width / 2}); FX.embers(r, {n:50}); }
    } else {
      st.running = false; st.mode = 'focus'; st.dur = st.remain = st.lastFocus || 25 * 60; st.start = null; save();
      toast('Pause vorbei. Bereit für den nächsten Block?', 'clock');
    }
    completing = false;
    if(S.view === 'lernen' && curTab('lernen') === 'fokus') rerenderBody(false);
    renderToday();
  }
  function rerender(){ if(S.view === 'lernen' && curTab('lernen') === 'fokus'){ const box = $('#ftBox'); if(box){ rerenderBody(false); } } }
  Object.assign(ACT, {
    ftDur: el => { st.dur = st.remain = +el.dataset.v * 60; save(); rerender(); },
    ftStart: () => {
      try{ if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); } else if(actx.state === 'suspended') actx.resume(); }catch(e){}
      const lab = $('#ftLabel'); if(lab) st.label = lab.value.trim();
      st.running = true; st.start = Date.now(); save(); lock(true); rerender();
      const b = $('.t-ring'); if(b){ const r = b.getBoundingClientRect(); FX.ring(r.left + r.width / 2, r.top + r.height / 2, {r:r.width / 2, life:800}); }
    },
    ftPause: () => { st.remain = left(); st.running = false; st.start = null; save(); lock(false); rerender(); },
    ftStop: async () => {
      const done = (st.dur - left()) / 60; const wasFocus = st.mode === 'focus';
      st.running = false; st.start = null; st.mode = 'focus'; st.dur = st.remain = st.lastFocus || st.dur; save(); lock(false);
      if(wasFocus && done >= 5){ await logMinutes(Math.floor(done)); toast(`${Math.floor(done)} Minuten gespeichert`, 'clock'); }
      rerender();
    },
    ftSkip: () => { st.mode = 'focus'; st.dur = st.remain = st.lastFocus || 25 * 60; save(); rerender(); }
  });
  CHG.ftLabel = el => { st.label = el.value.trim(); save(); };
  setInterval(() => { if(st.running && left() <= 0) complete(); }, 4000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden && st.running) paint(); });
  return {html, paint, leave(){ clearTimeout(tmr); }, running:() => st.running};
})();
function weekMinutes(){ const ws = weekStart(todayISO()); return S.focus.filter(f => f.id >= ws).reduce((a, f) => a + (f.minutes || 0), 0); }
function focusStreak(){ const set = new Set(S.focus.filter(f => f.minutes > 0).map(f => f.id)); let d = todayISO(); if(!set.has(d)) d = addDays(d, -1); let n = 0; while(set.has(d)){ n++; d = addDays(d, -1); } return n; }

const calcState = () => Object.assign({start:0, monthly:50, years:20, rate:6}, store.get('calc', {}));
const CALC_F = {start:euro, monthly:euro, years:v => v + ' J.', rate:v => de(v, 1) + ' %'};
function calcHTML(){
  const c = calcState();
  const sl = (k, label, min, max, step) => `<div class="field"><label for="cl_${k}">${label}</label><div class="rng"><input type="range" id="cl_${k}" min="${min}" max="${max}" step="${step}" value="${c[k]}" data-input="calc" data-k="${k}"><output id="clo_${k}" style="min-width:86px">${CALC_F[k](c[k])}</output></div></div>`;
  return `<div class="calc"><div class="panel"><div class="form">${sl('start', 'Startbetrag', 0, 10000, 100)}${sl('monthly', 'Monatlich sparen', 0, 500, 5)}${sl('years', 'Dauer', 1, 50, 1)}${sl('rate', 'Angenommene Rendite pro Jahr', 0, 10, .5)}</div></div><div id="calcOut">${calcOut(c)}</div></div><p class="note">Vereinfachte Rechnung mit monatlicher Verzinsung, ohne Kosten, Steuern und Inflation. Renditen sind nicht garantiert. Keine Anlageberatung.</p>`;
}
function calcOut(c){
  const r = c.rate / 100 / 12, n = c.years * 12, rows = []; let bal = c.start;
  for(let m = 1; m <= n; m++){ bal = bal * (1 + r) + c.monthly; if(m % 12 === 0) rows.push({y:m / 12, total:bal, paid:c.start + c.monthly * m}); }
  const total = rows.length ? rows[rows.length - 1].total : c.start, paid = c.start + c.monthly * n, gain = total - paid, dbl = c.rate > 0 ? Math.round(72 / c.rate) : null;
  return `<div class="calc-out"><span class="eyebrow">Nach ${c.years} ${plural(c.years, 'Jahr', 'Jahren')}</span><div class="big">${euro(total)}</div><div class="sp"><span>Eingezahlt <b>${euro(paid)}</b></span><span>Ertrag <b>${euro(gain)}</b></span>${dbl ? `<span>Verdopplung etwa alle <b>${dbl} Jahre</b></span>` : ''}</div></div>` +
    (rows.length >= 2 ? `<figure class="chart"><figcaption><strong>So wächst das Geld</strong><span class="legend"><span><i class="sq" style="background:#3F8FDE"></i>Eingezahlt</span><span><i class="sq" style="background:#E8691F"></i>Ertrag</span></span></figcaption>${chart({type:'area', h:230, xs:rows.map(x => x.y), base:rows.map(x => x.paid), top:rows.map(x => x.total), label:'Vermögen über die Jahre'})}${tableTwin(['Jahr', 'Eingezahlt', 'Ertrag', 'Gesamt'], rows.map(x => [x.y, euro(x.paid), euro(x.total - x.paid), euro(x.total)]))}</figure>` : '');
}
INP.calc = el => {
  const c = calcState(); c[el.dataset.k] = Number(el.value); store.set('calc', c);
  const o = $('#clo_' + el.dataset.k); if(o) o.textContent = CALC_F[el.dataset.k](Number(el.value));
  const out = $('#calcOut'); if(out){ out.innerHTML = calcOut(c); drawCharts(out); }
};

      if(i === 3) st(w, {opacity:eIn * (1 - eOut), transform:`scale(${(lerp(.6, 1, eIn) * lerp(1, .05, eOut)).toFixed(3)})`, filter:`blur(${(8 * (1 - eIn)).toFixed(1)}px)`, letterSpacing:`${lerp(-.12, -.045, eIn).toFixed(3)}em`, textShadow:`0 0 ${(40 * eIn).toFixed(0)}px rgba(255,122,31,.55)`});
    });
    if(t > 4.62 && t < 5.1) glow(ctx, cx, cy, 160 * Math.sin(seg(t, 4.62, .48) * Math.PI), '255,200,140', .5);
    /* Orbit der acht Bereiche */
    const rot = (t - 4.7) * .55, imp = E.inC(seg(t, 6.2, .42));
    icons.forEach((c, i) => {
      const p = E.outC(seg(t, 4.7 + i * .07, .8));
      if(p <= 0 || imp >= 1){ if(c.style.opacity !== '0') c.style.opacity = '0'; trails[i].length = 0; return; }
      const a0 = i / 8 * Math.PI * 2 - Math.PI / 2, ang = a0 + rot + (1 - p) * 1.6, rad = lerp(Math.max(W, H) * .75, R, p) * (1 - imp);
      const x = Math.cos(ang) * rad, y = Math.sin(ang) * rad, sc = lerp(.5, 1, p) * (1 - imp * .8);
      st(c, {opacity:(p * (1 - imp * .5)).toFixed(3), transform:`translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) scale(${sc.toFixed(3)})`});
      const tr = trails[i]; tr.push([cx + x, cy + y]); if(tr.length > 14) tr.shift();
      for(let k = 1; k < tr.length; k++){ ctx.globalAlpha = (k / tr.length) * .7 * p; ctx.strokeStyle = 'rgb(255,170,90)'; ctx.lineWidth = 2.4 * k / tr.length; ctx.beginPath(); ctx.moveTo(tr[k - 1][0], tr[k - 1][1]); ctx.lineTo(tr[k][0], tr[k][1]); ctx.stroke(); }
      ctx.globalAlpha = 1;
    });
    cap.style.opacity = (seg(t, 5.05, .4) * (1 - seg(t, 6.0, .3))).toFixed(3);
    cap.style.transform = `translateY(${(1 - seg(t, 5.05, .4)) * 12}px)`;
    /* Blitz und Schockwelle */
    if(t > 6.6){
      const k = seg(t, 6.6, .7);
      if(k < 1){ ctx.globalAlpha = (1 - k) * .55; const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * .8); g.addColorStop(0, 'rgba(255,236,210,1)'); g.addColorStop(.3, 'rgba(255,150,60,.5)'); g.addColorStop(1, 'rgba(255,122,31,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
        ctx.strokeStyle = `rgba(255,200,140,${1 - k})`; ctx.lineWidth = 3 * (1 - k) + .5; ctx.beginPath(); ctx.arc(cx, cy, 20 + E.outC(k) * Math.max(W, H) * .75, 0, 6.283); ctx.stroke(); }
      if(!flashed){ flashed = true; for(let i = 0; i < 60; i++) embers.push({x:cx, y:cy, vx:rand(-6, 6), vy:rand(-6, 6), r:rand(1, 2.6), t0:t, life:rand(.8, 1.6)}); }
    }
    /* Titel */
    const tOn = t > 6.7;
    title.style.opacity = tOn ? '1' : '0';
    if(tOn) letters.forEach((l, j) => { const k = E.outE(seg(t, 6.75 + j * .045, .75)); l.style.transform = `translateY(${((1 - k) * 110).toFixed(1)}%)`; l.style.backgroundPosition = `${lerp(100, -20, E.inOutC(seg(t, 7.55 + j * .02, .9))).toFixed(1)}% 0`; });
    sub.style.opacity = seg(t, 7.6, .5).toFixed(3); sub.style.transform = `translateY(${((1 - E.outC(seg(t, 7.6, .6))) * 16).toFixed(1)}px)`;
    stage.style.transform = `scale(${(1 + t * .005).toFixed(4)})`;
    bar.style.transform = `scaleX(${clamp(t / END).toFixed(4)})`;
    /* Vignette */
    ctx.globalCompositeOperation = 'source-over';
    const v = ctx.createRadialGradient(cx, cy, Math.min(W, H) * .3, cx, cy, Math.max(W, H) * .75); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
    if(t >= END){ doorway(); return; }
    raf = requestAnimationFrame(frame);
  }
  function doorway(){
    if(done) return; done = true; cancelAnimationFrame(raf); removeEventListener('resize', size);
    const home = $('#home');
    const mk = side => {
      const d = document.createElement('div'); d.className = 'door ' + side;
      const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; c.getContext('2d').drawImage(cv, 0, 0); d.append(c);
      const s = stage.cloneNode(true); $$('[id]', s).forEach(n => n.removeAttribute('id')); s.removeAttribute('id'); d.append(s); return d;
    };
    const L = mk('l'), Rt = mk('r');
    stage.style.visibility = 'hidden'; cv.style.visibility = 'hidden';
    $$('.i-skip, .i-bar', el).forEach(n => n.remove());
    el.classList.add('doorway'); el.append(L, Rt);
    home.style.visibility = '';
    document.body.classList.remove('lock');
    homeEntrance();
    anim(home, [{transform:'scale(.9)', filter:'blur(10px)', opacity:.2}, {transform:'none', filter:'blur(0px)', opacity:1}], {duration:1150, easing:EASE.out});
    anim(L, [{transform:'perspective(1400px) rotateY(0deg)', filter:'brightness(1)', opacity:1}, {transform:'perspective(1400px) rotateY(-84deg)', filter:'brightness(.35)', opacity:0}], {duration:1150, easing:EASE.inOut, fill:'forwards'});
    anim(Rt, [{transform:'perspective(1400px) rotateY(0deg)', filter:'brightness(1)', opacity:1}, {transform:'perspective(1400px) rotateY(84deg)', filter:'brightness(.35)', opacity:0}], {duration:1150, easing:EASE.inOut, fill:'forwards'})
      .then(() => { el.remove(); INTRO = null; });
  }
  el.addEventListener('click', () => doorway());
  INTRO = {skip:doorway};
  raf = requestAnimationFrame(frame);
}

/* =====================================================================
   EVENTS & START
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('[data-action]'); if(!el) return;
  const fn = ACT[el.dataset.action]; if(!fn) return;
  e.preventDefault(); fn(el, e);
});
document.addEventListener('input', e => { const el = e.target; if(el.type === 'range') syncRange(el); const fn = el.dataset && INP[el.dataset.input]; if(fn) fn(el, e); });
document.addEventListener('change', e => { const el = e.target; const fn = el.dataset && CHG[el.dataset.change]; if(fn) fn(el, e); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(INTRO){ INTRO.skip(); return; }
    if($('#sheet').classList.contains('show')){ closeSheet(); return; }
    if(R.open){ closeReport(); return; }
    if(S.view !== 'home') closeSection();
    return;
  }
  if(e.key !== 'Enter' || e.isComposing) return;
  const t = e.target;
  if(t.id === 'qa'){ e.preventDefault(); quickAdd(); return; }
  if(t.dataset && t.dataset.enter && ACT[t.dataset.enter]){ e.preventDefault(); ACT[t.dataset.enter](t, e); return; }
  if(FS && FS.form && t.closest && t.closest('#theForm')){
    if(t.tagName === 'TEXTAREA'){ if(e.metaKey || e.ctrlKey){ e.preventDefault(); formSave(); } return; }
    if(t.tagName === 'INPUT' && !['date','time','range'].includes(t.type)){
      e.preventDefault();
      if(t.closest('[data-goal]')){ const all = $$('#sheet [data-goal] input'), i = all.indexOf(t); if(t.value.trim() && all[i + 1]){ all[i + 1].focus(); return; } }
      formSave(); return;
    }
  }
  if(t.id === 'vurl'){ e.preventDefault(); summarize(t.value); return; }
  if(t.id === 'habNew'){ e.preventDefault(); ACT.habAdd(); return; }
  if(t.id && t.id.startsWith('rt_new_')){ e.preventDefault(); ACT.rtAdd({dataset:{p:t.id.slice(7)}}); return; }
  if(R.open && t.tagName === 'INPUT' && t.classList.contains('r-in')){
    e.preventDefault();
    const all = $$('#rMain input.r-in'), i = all.indexOf(t);
    if(i >= 0 && i < all.length - 1 && !all[i + 1].value){ all[i + 1].focus(); return; }
    rNext(); return;
  }
  if(R.open && t.tagName === 'TEXTAREA' && (e.metaKey || e.ctrlKey)){ e.preventDefault(); rNext(); return; }
  if($('#sheet').classList.contains('show') && t.tagName === 'INPUT' && t.classList.contains('txt') && FS && FS.form){ e.preventDefault(); formSave(); }
});
document.addEventListener('visibilitychange', () => { if(!document.hidden) scheduleRender(); });
let dayKey = todayISO();
setInterval(() => { if(todayISO() !== dayKey){ dayKey = todayISO(); scheduleRender(); } }, 60000);

function boot(){
  renderHome();
  initCaps();
  connect();
  runIntro(false);
}
boot();
</script>
