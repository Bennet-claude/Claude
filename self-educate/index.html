.calc-out .sp{ display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:12px; font-size:14px; color:var(--muted); }
.calc-out .sp b{ color:var(--text); }

.mrow{ display:flex; align-items:center; gap:12px; }
.rate{ flex:none; width:46px; height:46px; border-radius:14px; display:grid; place-items:center; font-size:19px; font-weight:800; letter-spacing:-.02em; background:var(--wash); color:var(--accent-2); }

/* ---------- report overlay ---------- */
#report{ position:fixed; inset:0; z-index:70; display:none; background:#0B0A10; color:var(--text); overflow:hidden; }
#report.open{ display:block; }
#rcv{ position:absolute; inset:0; width:100%; height:100%; transition:opacity .25s linear; }
.r-top{ position:absolute; z-index:3; left:0; right:0; top:0; display:flex; align-items:center; gap:14px; padding:calc(12px + env(safe-area-inset-top,0px)) var(--gutter) 8px; }
.r-top .icon-btn{ background:rgba(20,14,11,.5); border-color:rgba(255,255,255,.08); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
.r-prog{ flex:1; display:flex; gap:4px; }
.r-prog i{ flex:1; height:4px; border-radius:4px; background:rgba(255,255,255,.12); overflow:hidden; }
.r-prog i::after{ content:""; display:block; height:100%; border-radius:4px; background:linear-gradient(90deg, var(--accent), var(--accent-2)); transform:scaleX(0); transform-origin:left; transition:transform .7s var(--ease-out); }
.r-prog i.on::after{ transform:scaleX(1); }
.r-count{ font-family:var(--mono); font-size:12px; color:rgba(246,237,228,.6); min-width:44px; text-align:right; }
.r-scroll{ position:absolute; z-index:2; inset:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
.r-main{ position:relative; max-width:660px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; justify-content:flex-end; padding:calc(38vh + env(safe-area-inset-top,0px)) var(--gutter) calc(120px + env(safe-area-inset-bottom,0px)); }
@media (max-height:640px){ .r-main{ padding-top:calc(30vh + env(safe-area-inset-top,0px)); } }
.r-main.top{ justify-content:flex-start; padding-top:calc(13vh + env(safe-area-inset-top,0px)); }
.r-eyebrow{ display:inline-flex; align-items:center; gap:8px; }
.r-eyebrow .n{ color:rgba(246,237,228,.45); }
.r-q{ margin:12px 0 0; font-size:clamp(34px, 8.6vw, 62px); font-weight:800; font-stretch:82%; letter-spacing:-.035em; line-height:.98; }
.r-q .w{ display:inline-block; will-change:transform; }
.r-hint{ margin:12px 0 0; color:rgba(246,237,228,.66); font-size:16px; max-width:52ch; }
.r-body{ margin-top:24px; display:flex; flex-direction:column; gap:14px; }
.r-big{ display:flex; align-items:baseline; gap:12px; }
.r-big b{ font-size:clamp(64px, 18vw, 104px); font-weight:800; font-stretch:80%; line-height:.9; letter-spacing:-.05em; font-variant-numeric:tabular-nums; }
.r-big span{ font-family:var(--serif); font-style:italic; font-size:clamp(24px, 6vw, 34px); color:var(--accent-2); }
.r-in{ width:100%; min-height:52px; padding:14px 16px; border-radius:16px; background:rgba(20,14,11,.55); border:1px solid rgba(255,255,255,.10); font-size:17px; line-height:1.5; outline:none; color:var(--text); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); transition:border-color .2s, box-shadow .2s; }
.r-in:focus{ border-color:rgba(255,160,90,.55); box-shadow:0 0 0 4px rgba(255,122,31,.12); }
.r-in::placeholder{ color:rgba(246,237,228,.38); }
textarea.r-in{ min-height:108px; resize:none; }
.r-nums{ display:flex; flex-direction:column; gap:10px; }
.r-nums .mi{ display:flex; align-items:center; gap:12px; }
.r-nums .mi > span{ flex:none; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-family:var(--mono); font-size:13px; font-weight:600; color:var(--accent-ink); background:linear-gradient(135deg, var(--accent), var(--accent-2)); }
.r-chips{ display:flex; flex-wrap:wrap; gap:8px; }
.r-chips .chip{ background:rgba(20,14,11,.55); border-color:rgba(255,255,255,.10); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
.r-chips .chip[aria-pressed="true"]{ background:rgba(255,122,31,.22); border-color:rgba(255,160,90,.55); color:#fff; }
.r-lbl{ font-size:13px; font-weight:600; color:rgba(246,237,228,.62); margin-bottom:-4px; }
.r-habits{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; }
@media (max-width:420px){ .r-habits{ grid-template-columns:1fr; } }
.r-habits .chk{ background:rgba(20,14,11,.55); border-color:rgba(255,255,255,.10); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
.r-habits .chk[aria-pressed="true"]{ background:rgba(255,122,31,.2); border-color:rgba(255,160,90,.5); }
.r-nav{ position:absolute; z-index:4; left:0; right:0; bottom:0; display:flex; justify-content:center; gap:10px; padding:16px var(--gutter) calc(18px + env(safe-area-inset-bottom,0px)); background:linear-gradient(transparent, rgba(8,7,12,.85) 45%); }
.r-nav .btn{ min-height:52px; padding:14px 24px; }
.r-nav .btn.ghost{ color:rgba(246,237,228,.75); }
.r-nav .grow{ flex:1; max-width:340px; }
.r-saved{ position:absolute; z-index:4; right:var(--gutter); top:calc(58px + env(safe-area-inset-top,0px)); display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px; color:rgba(246,237,228,.5); opacity:0; transition:opacity .4s; }
.r-saved.show{ opacity:1; }
.r-saved svg{ width:13px; height:13px; color:var(--ok); }
.r-final{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; }
.r-final h2{ margin:6px 0 0; font-family:var(--serif); font-style:italic; font-weight:400; font-size:clamp(44px, 12vw, 84px); line-height:1; letter-spacing:-.01em; }
.score{ position:relative; width:150px; height:150px; margin:8px auto 4px; }
.score svg{ width:100%; height:100%; transform:rotate(-90deg); overflow:visible; }
.score .trk{ fill:none; stroke:rgba(255,255,255,.1); stroke-width:9; }
.score .prg{ fill:none; stroke:url(#sg); stroke-width:9; stroke-linecap:round; filter:drop-shadow(0 0 8px rgba(255,122,31,.6)); }
.score .mid{ position:absolute; inset:0; display:grid; place-items:center; align-content:center; }
.score .mid b{ font-size:50px; font-weight:800; letter-spacing:-.04em; line-height:1; }
.score .mid span{ font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(246,237,228,.55); margin-top:4px; }
.r-sum{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:10px; }
.r-sum .pill{ font-size:12px; padding:5px 11px; background:rgba(255,255,255,.07); color:rgba(246,237,228,.85); }
.r-streak{ display:inline-flex; align-items:center; gap:8px; margin-top:6px; font-weight:700; color:var(--accent-2); }
.r-streak svg{ width:22px; height:22px; }
.r-final .ai{ width:100%; text-align:left; background:rgba(20,14,11,.6); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
.r-start .r-q{ font-size:clamp(46px, 12vw, 88px); }
.r-start .meta{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
.r-start .meta .pill{ background:rgba(255,255,255,.08); color:rgba(246,237,228,.8); font-size:12px; padding:5px 11px; }

/* ---------- intro ---------- */
#intro{ position:fixed; inset:0; z-index:100; overflow:hidden; background:radial-gradient(120% 90% at 50% 50%, #1E120A 0%, #0C0907 60%, #070504 100%); cursor:pointer; }
#intro.doorway{ background:transparent; }
#icv{ position:absolute; inset:0; width:100%; height:100%; }
.i-stage{ position:absolute; inset:0; }
.i-ring{ position:absolute; left:50%; top:50%; width:150px; height:150px; margin:-75px 0 0 -75px; overflow:visible; will-change:transform, opacity; }
.i-ring .trk{ fill:none; stroke:rgba(255,140,60,.12); stroke-width:2; }
.i-ring .drw{ fill:none; stroke:url(#ig); stroke-width:3.2; stroke-linecap:round; }
.i-ring .core{ fill:#FFB25B; }
.i-word{ position:absolute; left:0; right:0; top:50%; margin-top:-.55em; text-align:center; font-size:clamp(58px, 17vw, 190px); font-weight:800; font-stretch:78%; letter-spacing:-.045em; line-height:1.1; white-space:nowrap; opacity:0; will-change:transform, opacity, filter; }
.i-word span{ display:inline-block; will-change:transform, opacity; }
.i-ic{ position:absolute; left:50%; top:50%; width:48px; height:48px; margin:-24px 0 0 -24px; border-radius:16px; display:grid; place-items:center; color:#FFB25B; background:linear-gradient(145deg, rgba(255,122,31,.30), rgba(40,22,10,.9)); box-shadow:inset 0 0 0 1px rgba(255,160,90,.35), 0 10px 30px -10px rgba(255,122,31,.8); opacity:0; will-change:transform, opacity; }
.i-ic svg{ width:24px; height:24px; }
.i-cap{ position:absolute; left:0; right:0; top:calc(50% + min(34vw, 230px)); text-align:center; font-family:var(--mono); font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:rgba(255,178,91,.8); opacity:0; }
.i-title{ position:absolute; left:0; right:0; top:50%; margin-top:calc(-.5em + 30px); text-align:center; font-size:clamp(56px, 15.5vw, 176px); font-weight:800; font-stretch:78%; letter-spacing:-.045em; line-height:1; white-space:nowrap; opacity:0; }
.i-title .m{ display:inline-block; overflow:hidden; padding:0 .01em .08em; margin-bottom:-.08em; vertical-align:bottom; }
.i-title .m > span{ display:inline-block; will-change:transform; }
.i-title .shine{ background:linear-gradient(100deg, #F6EDE4 0%, #F6EDE4 40%, #FFE2B3 47%, #FF9A3D 50%, #FFE2B3 53%, #F6EDE4 60%, #F6EDE4 100%); background-size:300% 100%; background-position:100% 0; -webkit-background-clip:text; background-clip:text; color:transparent; }
.i-sub{ position:absolute; left:0; right:0; top:50%; margin-top:calc(.5em + 62px); text-align:center; font-family:var(--serif); font-style:italic; font-size:clamp(22px, 5vw, 34px); color:#FFB25B; opacity:0; }
.i-skip{ position:absolute; z-index:3; right:var(--gutter); top:calc(14px + env(safe-area-inset-top,0px)); display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:999px; font-size:14px; font-weight:600; color:rgba(246,237,228,.75); background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); transition:background .2s, color .2s; }
.i-skip:hover{ background:rgba(255,255,255,.12); color:#fff; }
.i-skip svg{ width:15px; height:15px; }
.i-bar{ position:absolute; z-index:3; left:var(--gutter); right:var(--gutter); bottom:calc(22px + env(safe-area-inset-bottom,0px)); height:2px; border-radius:2px; background:rgba(255,255,255,.08); overflow:hidden; }
.i-bar i{ display:block; height:100%; width:100%; transform-origin:left; transform:scaleX(0); background:linear-gradient(90deg, var(--accent-3), var(--accent-2)); }
.door{ position:absolute; inset:0; overflow:hidden; background:radial-gradient(120% 90% at 50% 50%, #1E120A 0%, #0C0907 60%, #070504 100%); will-change:transform, opacity; backface-visibility:hidden; }
.door canvas{ position:absolute; inset:0; width:100%; height:100%; }
.door.l{ clip-path:inset(0 50% 0 0); transform-origin:0 50%; }
.door.r{ clip-path:inset(0 0 0 50%); transform-origin:100% 50%; }
.door::after{ content:""; position:absolute; inset:0; background:#000; opacity:var(--shade,0); }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important; }
}
/* ===================== Kern: Eintragen zuerst, Text bei Bedarf ===================== */
/* Lead mit aufklappbarer Erklärung */
.vh-lead > p{ margin:0; }
.lead-more{ margin-top:8px; }
.lead-more summary{ display:inline-flex; align-items:center; gap:6px; cursor:pointer; list-style:none; font-size:13.5px; font-weight:600; color:var(--accent-2); padding:4px 10px 4px 8px; margin-left:-8px; border-radius:999px; transition:background .2s; }
.lead-more summary::-webkit-details-marker{ display:none; }
.lead-more summary:hover{ background:var(--wash); }
.lead-more summary svg{ width:15px; height:15px; }
.lead-more[open] summary{ color:var(--muted); }
.lead-more p{ margin:8px 0 0; padding:12px 14px; border-radius:var(--r-md); background:var(--bg-2); border:1px solid var(--line); font-size:15px; animation:fadeDown .35s var(--ease-out); }
@keyframes fadeDown{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:none; } }
/* Wissens-Tab: optisch abgesetzt, immer am Ende */
.tab.wissen{ display:inline-flex; align-items:center; gap:6px; margin-left:10px; }
.tab.wissen::before{ content:""; position:absolute; left:-7px; top:9px; bottom:9px; width:1px; background:var(--line-strong); }
.tab.wissen svg{ width:15px; height:15px; }
.wissen-b > .toolbar:first-child{ margin-top:0; }
/* Eingeklappte Erklärung */
.howto{ margin:0 0 14px; border-radius:var(--r-md); background:var(--bg-2); border:1px solid var(--line); overflow:hidden; }
.howto summary{ display:flex; align-items:center; gap:10px; padding:11px 14px; cursor:pointer; list-style:none; font-size:14px; font-weight:600; color:var(--muted); }
.howto summary::-webkit-details-marker{ display:none; }
.howto summary > svg:first-child{ width:17px; height:17px; color:var(--accent-2); flex:none; }
.howto summary > span{ flex:1; }
.howto summary > svg:last-child{ width:16px; height:16px; transition:transform .3s var(--spring); }
.howto[open] summary > svg:last-child{ transform:rotate(180deg); }
.howto-b{ padding:0 14px 14px; color:var(--muted); font-size:15px; animation:fadeDown .35s var(--ease-out); }
.howto-b p{ margin:0 0 8px; } .howto-b p:last-child{ margin:0; }
.howto-b ol, .howto-b ul{ margin:6px 0 0; padding-left:20px; }
/* Schnell-Eingabe in Listen */
.quick.qb{ margin-bottom:2px; }
/* Formular: Kopf, Erklärung auf Wunsch, Entwurf, Mehr Details */
.sheet-h{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
.sheet-h h2{ margin:0; }
.info-btn{ flex:none; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:var(--faint); border:1px solid var(--line); transition:color .2s, border-color .2s, background .2s; margin-top:2px; }
.info-btn svg{ width:17px; height:17px; }
.info-btn:hover, .info-btn[aria-expanded="true"]{ color:var(--accent-2); border-color:var(--line-strong); background:var(--wash); }
.sheet #formSub{ margin:-4px 0 16px; padding:10px 14px; border-radius:14px; background:var(--bg-2); border:1px solid var(--line); }
.draft-bar{ display:flex; align-items:center; gap:10px; margin:0 0 16px; padding:6px 6px 6px 14px; border-radius:999px; background:var(--wash-2); border:1px solid rgba(255,178,91,.2); font-size:13.5px; color:var(--accent-2); }
.draft-bar svg{ width:15px; height:15px; flex:none; }
.draft-bar span{ flex:1; }
.more-f{ border-radius:var(--r-md); border:1px dashed var(--line-strong); background:var(--bg-2); }
.more-f summary{ display:flex; flex-direction:column; gap:2px; padding:12px 14px; cursor:pointer; list-style:none; }
.more-f summary::-webkit-details-marker{ display:none; }
.more-f summary > span{ display:flex; align-items:center; gap:8px; font-size:14.5px; font-weight:650; color:var(--text); }
.more-f summary > span svg{ width:16px; height:16px; color:var(--accent-2); transition:transform .35s var(--spring); }
.more-f[open] summary > span svg{ transform:rotate(45deg); }
.more-f summary small{ color:var(--faint); font-size:12.5px; padding-left:24px; }
.more-f[open]{ border-style:solid; }
.more-in{ display:flex; flex-direction:column; gap:18px; padding:4px 14px 16px; animation:fadeDown .35s var(--ease-out); }
.dq, .sugg{ display:flex; flex-wrap:wrap; gap:6px; }
.chip.sm{ min-height:30px; padding:4px 11px; font-size:13px; }
.sugg .chip.sm{ background:var(--bg-2); border-style:dashed; }
.sugg .chip.sm[aria-pressed="true"]{ opacity:.45; }
.stepper{ display:flex; align-items:center; gap:8px; }
.stepper .txt{ width:96px; text-align:center; font-variant-numeric:tabular-nums; -moz-appearance:textfield; }
.stepper .txt::-webkit-outer-spin-button, .stepper .txt::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.stepper .icon-btn{ font-size:20px; font-weight:600; color:var(--text); }
.money-in{ position:relative; }
.money-in .txt{ padding-right:38px; font-variant-numeric:tabular-nums; }
.money-in span{ position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--faint); font-weight:600; pointer-events:none; }
/* Startseite: Schnell eintragen */
.qgrid{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; }
.qbtn{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 6px 12px; border-radius:20px; background:linear-gradient(160deg, var(--surface-2), var(--surface)); border:1px solid var(--line); font-size:13px; font-weight:650; color:var(--text); transition:transform .3s var(--spring), border-color .2s, box-shadow .3s; }
.qbtn:hover{ border-color:var(--line-strong); box-shadow:0 14px 30px -20px rgba(255,122,31,.6); transform:translateY(-2px); }
.qbtn:active{ transform:scale(.94); }
.qi{ width:38px; height:38px; border-radius:13px; display:grid; place-items:center; background:var(--wash); color:var(--accent-2); }
.qi svg{ width:20px; height:20px; }
@media (min-width:640px){ .qgrid{ grid-template-columns:repeat(8, minmax(0,1fr)); } }
/* Gemeinsame Eintrags-Bausteine */
.amt{ font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:700; }
.amt.in{ color:var(--ok); }
.amt.out{ color:#FF9A80; }
.row > .amt{ align-self:center; font-size:15px; }
.row > .btn.sm{ align-self:center; flex:none; }
.kick .due{ color:var(--accent-2); font-weight:600; }
.kick .late{ color:#FF8A80; font-weight:600; }
/* ---- notizen ---- */
/* Schnell-Eingabe und erkannte Angaben */
.nb-quick .nb-more{ flex:none; color:var(--muted); }
.nb-quick .nb-more svg{ width:16px; height:16px; }
.nb-quick input:placeholder-shown ~ .nb-more{ display:none; }
.nb-hint{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; min-height:30px; margin:7px 2px 0; }
.nb-ex{ font-size:12.5px; color:var(--faint); line-height:1.4; animation:fadeDown .3s var(--ease-out); }
.nb-ex b{ color:var(--muted); font-weight:600; font-family:var(--mono); font-size:12px; }
.nb-qc{ display:inline-flex; align-items:center; gap:5px; min-height:28px; padding:3px 10px 3px 8px; border-radius:999px; background:var(--wash); border:1px solid var(--line-2); color:var(--accent-2); font-size:12.5px; font-weight:600; white-space:nowrap; max-width:100%; transition:opacity .2s, background .2s, color .2s, transform .25s var(--spring); animation:nbPop .3s var(--spring); }
.nb-qc svg{ width:13px; height:13px; flex:none; }
button.nb-qc:active{ transform:scale(.94); }
.nb-qc.off{ opacity:.55; background:transparent; color:var(--faint); text-decoration:line-through; }
.nb-qc.to{ background:var(--surface-2); border-color:var(--line); color:var(--muted); padding-left:10px; }
@keyframes nbPop{ from{ opacity:0; transform:scale(.88); } to{ opacity:1; transform:none; } }
.nb-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; flex:none; }
.group-h .nb-dot{ margin-right:-2px; }
/* Filter und Gruppen */
.nb-bar{ margin:10px 0 2px; }
.nb-groups > .group-h:first-child{ margin-top:12px; }
.nb-list{ gap:8px; }
.nb-empty{ margin-top:10px; }
.nb-how{ margin-top:22px; }
.nb-how .howto{ margin:0; }
/* Kompakte Zeilen */
.row.nb-row{ align-items:flex-start; gap:11px; padding:10px 8px 10px 12px; border-radius:16px; }
.nb-row .check{ width:26px; height:26px; margin-top:0; }
.nb-row .check svg{ width:14px; height:14px; }
.nb-row .rt{ padding-top:2px; font-size:15.5px; line-height:1.4; }
.nb-row .rt small{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13px; margin-top:2px; }
.nb-row .meta{ margin-top:4px; gap:4px 8px; font-size:12.5px; }
.nb-row .meta .pill{ gap:6px; }
.nb-row .del{ height:30px; min-width:30px; margin-top:-2px; }
.nb-rep{ display:inline-flex; align-items:center; gap:4px; color:var(--muted); }
.nb-rep svg{ width:12px; height:12px; }
.nb-mv{ flex:none; height:28px; margin-top:-1px; padding:0 11px; border-radius:999px; font-size:12.5px; font-weight:650; color:var(--accent-2); background:var(--wash); border:1px solid var(--line-2); transition:background .2s, transform .25s var(--spring); }
.nb-mv:hover{ background:rgba(255,122,31,.2); }
.nb-mv:active{ transform:scale(.94); }
.del.nb-plan{ display:inline-flex; align-items:center; gap:6px; padding:0 7px; color:var(--accent-2); }
.del.nb-plan span{ display:none; font-size:12.5px; font-weight:650; }
@media (min-width:560px){ .del.nb-plan{ padding:0 11px 0 9px; background:var(--wash); } .del.nb-plan span{ display:inline; } }
/* Erledigt: Aufräumen knapp */
.nb-clean{ display:flex; align-items:center; gap:10px; margin:4px 0 0; padding:5px 5px 5px 14px; border-radius:999px; background:var(--bg-2); border:1px solid var(--line); font-size:13.5px; color:var(--muted); }
.nb-clean > span{ flex:1; min-width:0; }
.nb-clean + .group-h{ margin-top:16px; }
/* Formular: leere Erkennungs-Zeile nimmt keinen Platz weg */
.nb-form #smartHint:empty{ min-height:0; margin:-7px 0 0; }
/* Formular: Datum mit Kürzeln über die volle Breite, Uhrzeit daneben */
.nb-form .frow.nb-when{ grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); grid-template-areas:"dl tl" "di ti" "dq dq"; column-gap:12px; row-gap:7px; }
.nb-when > .field{ display:contents; }
.nb-when > [data-f="date"] > label{ grid-area:dl; }
.nb-when > [data-f="date"] > input{ grid-area:di; }
.nb-when > [data-f="date"] > .dq{ grid-area:dq; margin-top:2px; }
.nb-when > [data-f="time"] > label{ grid-area:tl; }
.nb-when > [data-f="time"] > input{ grid-area:ti; }
/* ---- lernen ---- */
/* Abstände und kleine Bausteine */
.lr-gap{ margin-top:16px; }
.lr-gap > .howto{ margin-bottom:0; }
.lr-none{ margin:4px 2px 0; color:var(--faint); font-size:14.5px; }
.lr-link{ display:inline-flex; align-items:center; gap:7px; padding:6px 12px 6px 10px; margin-top:4px; border-radius:999px; background:var(--wash); color:var(--accent-2); font-size:13.5px; font-weight:600; transition:background .2s; }
.lr-link:hover{ background:rgba(255,122,31,.2); }
.lr-link svg{ width:15px; height:15px; flex:none; }
.howto-b .sugg{ margin-top:8px; }
.howto-b ol li + li{ margin-top:4px; }

/* Prüfungen: Schnell-Eingabe mit erkanntem Fach und Datum */
.lr-qh{ flex-wrap:wrap; row-gap:6px; min-height:0; margin:8px 4px 0; }
.lr-qh:empty{ margin:0; }
.lr-qh .pill{ max-width:100%; overflow:hidden; text-overflow:ellipsis; }
.lr-qh-act{ margin-left:auto; font-size:12px; color:var(--faint); white-space:nowrap; }
.exam.fresh{ animation:fresh 1.6s var(--ease-out); }
.exam-h .eyebrow{ display:block; overflow-wrap:anywhere; }
.cd .lr-cd-sm{ font-size:17px; letter-spacing:-.01em; padding:4px 0 3px; }
.lr-cdg b{ font-size:24px; }
.lr-cdg.good{ background:rgba(122,203,134,.12); border-color:rgba(122,203,134,.3); }
.lr-cdg.good b{ color:var(--ok); }
.lr-cdg.good span{ color:var(--ok); }
.lr-cdg.bad{ background:rgba(255,90,78,.12); border-color:rgba(255,90,78,.3); }
.lr-cdg.bad b, .lr-cdg.bad span{ color:#FF8A80; }
.exam.lr-past{ padding:16px 18px; }
.exam.lr-past .exam-h h4{ font-size:17px; }
.exam.lr-past .actions{ margin-top:12px; }
.lr-planrow{ margin-top:12px; gap:10px; font-size:13px; }
.lr-planrow .meter{ height:5px; }
.row.lr-due .rt{ padding-top:0; }
.row.lr-due .meta{ margin-top:4px; }

/* Noten: Schnell-Auswahl nach Fach */
.lr-pick{ margin-bottom:16px; }
.lr-pick-h{ display:flex; align-items:center; gap:7px; margin:0 2px 8px; font-size:13px; font-weight:600; color:var(--muted); }
.lr-pick-h svg{ width:15px; height:15px; color:var(--accent-2); }
.lr-pick .chip{ min-height:40px; padding:8px 16px; color:var(--text); background:var(--surface-2); border-color:var(--line-2); }
.lr-pick .chip:hover{ border-color:var(--line-strong); }
.lr-pick .lr-chip-more{ background:transparent; border-style:dashed; color:var(--muted); }
.lr-scale{ margin:-4px 0 14px; }
.lr-stats .st b.lr-good{ color:var(--ok); }
.lr-stats .st b.lr-bad{ color:#FF8A80; }
.lr-stats .lr-st-s{ display:block; margin:2px 0 0; }

/* Noten: Fach-Karten */
.lr-sub .rate.lr-rate{ font-size:16px; }
.rate.lr-rate.good{ background:rgba(122,203,134,.13); color:var(--ok); }
.rate.lr-rate.bad{ background:rgba(255,90,78,.13); color:#FF8A80; }
.lr-gchips{ display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.lr-gchips i{ font-style:normal; font-family:var(--mono); font-size:12px; line-height:1.5; padding:1px 8px; border-radius:8px; background:var(--surface-3); color:var(--muted); }
.lr-gchips i.good{ background:rgba(122,203,134,.12); color:var(--ok); }
.lr-gchips i.bad{ background:rgba(255,90,78,.12); color:#FF8A80; }
.lr-chart{ margin:0 0 12px; padding:12px 8px 8px; background:var(--bg-2); }
.lr-sub .inner > .list{ gap:8px; }
.lr-sub .inner .row{ background:var(--bg-2); }

/* Noten: Einzelnote als Zeile */
.lr-gb{ flex:none; align-self:center; min-width:46px; height:40px; padding:0 8px; border-radius:12px; display:grid; place-items:center; font-size:17px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; white-space:nowrap; background:var(--wash); color:var(--accent-2); }
.lr-gb.good{ background:rgba(122,203,134,.13); color:var(--ok); }
.lr-gb.bad{ background:rgba(255,90,78,.13); color:#FF8A80; }
.row.lr-grow{ align-items:center; }
.row.lr-grow .rt{ padding-top:0; }
.row.lr-grow .meta{ margin-top:4px; }

/* Noten-Formular: Ziffern als große Tasten */
.sheet [data-f="gnote"] .chips{ flex-wrap:nowrap; gap:6px; }
.sheet [data-f="gnote"] .chip{ flex:1 1 0; min-width:0; justify-content:center; min-height:50px; padding:0; font-size:20px; font-weight:750; color:var(--text); border-radius:16px; }
.sheet [data-f="gnote"] .chip[aria-pressed="true"]{ background:linear-gradient(135deg, var(--accent), var(--accent-2)); border-color:transparent; color:var(--accent-ink); }
.sheet [data-f="gtend"] .seg button{ min-width:58px; font-size:16px; }

/* Feynman-Check: Formular zuerst */
.lr-fy{ display:flex; flex-direction:column; gap:16px; }
.lr-frow{ display:grid; grid-template-columns:minmax(0,1fr); gap:16px; }
@media (min-width:640px){ .lr-frow{ grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; } }
.lr-fy-go{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; }
.lr-fyn{ font-size:13px; color:var(--faint); font-variant-numeric:tabular-nums; }
.lr-fyn.ok{ color:var(--ok); }
.lr-fy #fyOut:empty{ display:none; }
.lr-fy #fyOut .ai{ margin-top:0; }
.lr-how ol + p, .lr-how ul + p{ margin-top:10px; }
.lr-how .lr-link{ margin-top:2px; }

/* Lernplan: die globale Klasse .today (Startseite) darf den heutigen Schritt nicht verschieben */
.exam .ses{ margin-top:0; max-width:none; }
/* Lernplan: auf schmalen Bildschirmen Datum über dem Schritt */
@media (max-width:560px){
  .exam .ses{ display:grid; grid-template-columns:22px minmax(0,1fr); column-gap:12px; row-gap:1px; align-items:center; padding:8px 10px; }
  .exam .ses .box{ grid-row:span 2; }
  .exam .ses .d{ width:auto; font-size:11.5px; line-height:1.3; }
  .exam .ses .l{ line-height:1.38; }
}
/* Regeln: farbiger Punkt nach Art (wie in den Filter-Chips) statt doppeltem Etikett */
.row.lr-rule .meta::before{ content:""; width:8px; height:8px; border-radius:50%; background:var(--accent); }
.row.lr-erkenntnis .meta::before{ background:#62B6F5; }
.row.lr-fehler .meta::before{ background:#FF8A80; }
.btn.sm.lr-icon{ padding:7px 10px; }
.btn.sm.lr-icon.armed{ padding:7px 13px; }
/* Breite Bildschirme: Prüfungskarten zweispaltig */
@media (min-width:900px){
  .lr-exlist{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; align-items:start; }
  .lr-exlist > .exam + .exam{ margin-top:0; }
}
/* ---- videos ---- */
/* Link-Eingabe: kompakt, Erklärung nur per Info-Knopf */
.add-video.vd-add{ padding:14px 14px 14px 16px; }
.vd-h{ display:flex; align-items:center; gap:10px; margin:0 0 10px; }
.vd-h h4{ flex:1; min-width:0; margin:0; font-size:17.5px; }
.vd-h .info-btn{ width:32px; height:32px; margin:0; }
.vd-in{ display:flex; align-items:center; gap:8px; padding:4px 4px 4px 14px; border-radius:999px; background:var(--bg-2); border:1px solid var(--line-2); transition:border-color .2s, box-shadow .3s, opacity .2s; }
.vd-in:focus-within{ border-color:var(--line-strong); box-shadow:0 0 0 4px rgba(255,122,31,.08); }
.vd-in > svg{ width:18px; height:18px; flex:none; color:var(--faint); }
.vd-in input{ flex:1; min-width:0; min-height:40px; padding:0; background:none; border:0; outline:none; font-size:16px; color:var(--text); text-overflow:ellipsis; }
.vd-in input::placeholder{ color:var(--faint); }
.vd-in.busy input{ color:var(--muted); }
.vd-go{ flex:none; min-height:40px; }
.vd-go:disabled{ opacity:.55; }
.vd-go .vd-gl{ display:inline-flex; align-items:center; gap:7px; }
.vd-go .vd-gs{ display:none; }
.vd-go .vd-gs svg{ width:18px; height:18px; }
@media (max-width:480px){
  .vd-go{ width:40px; min-width:40px; padding:0; }
  .vd-go .vd-gl{ display:none; }
  .vd-go .vd-gs{ display:grid; place-items:center; }
}
.vd-low{ display:flex; align-items:flex-start; gap:8px; margin:10px 2px 0; font-size:13px; line-height:1.45; color:var(--warn); }
.vd-low svg{ width:15px; height:15px; flex:none; margin-top:1px; }
.vd-add .stages{ margin-top:14px; }
.vd-add .actions{ margin-top:12px; }
.vd-info{ margin-top:14px; padding-top:12px; border-top:1px solid var(--line); font-size:14.5px; line-height:1.5; color:var(--muted); animation:fadeDown .35s var(--ease-out); }
.vd-info p{ margin:0 0 8px; }
.vd-info .tgl{ margin-top:10px; font-size:14.5px; }
.vd-info .tgl b{ font-weight:600; color:var(--text); }
.vd-info .tgl small{ font-size:12.5px; }
/* Leerer Zustand */
.vd-empty{ margin-top:16px; }
.vd-empty .btn svg{ width:16px; height:16px; }
/* In Arbeit */
.row.vd-q{ align-items:flex-start; }
.vd-q .check{ border-color:var(--accent); opacity:.85; }
.vd-q .check.vd-spin{ border-right-color:transparent; animation:spin .8s linear infinite; }
.vd-q .meta{ gap:6px; }
.vd-q .meta .btn{ padding-inline:11px; }
.vd-q .meta .btn.ghost{ padding-inline:8px; }
/* Offen zum Anwenden */
.vd-todo{ gap:8px; }
.vd-todo .chk{ align-items:flex-start; padding:11px 14px; background:var(--surface); }
.vd-todo .chk .box{ margin-top:1px; }
.vd-todo .chk .l{ line-height:1.42; }
.vd-todo .chk .l small{ display:flex; align-items:center; gap:6px; margin-top:4px; font-size:12.5px; color:var(--faint); }
.vd-todo .chk .l small span{ min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.vd-todo .chk .l small i{ flex:none; width:7px; height:7px; border-radius:50%; }
.vd-todo .chk[aria-pressed="true"] .l{ color:var(--muted); text-decoration:line-through; text-decoration-color:rgba(255,160,90,.5); }
.vd-tmore{ align-self:flex-start; margin-top:2px; }
@media (min-width:760px){
  .vd-todo{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); }
  .vd-tmore{ grid-column:1 / -1; justify-self:start; }
}
/* Karte */
.vd-card .applied .chk{ align-items:flex-start; }
.vd-card .applied .chk .l{ line-height:1.45; }
.vd-card .applied .chk .box{ margin-top:-1px; }
.vd-cnt{ margin-left:10px; color:var(--faint); letter-spacing:.08em; }
.vd-note h5 label{ cursor:pointer; }
.vd-note textarea.txt{ min-height:84px; background:var(--bg-2); }
.vd-note textarea.txt:focus{ border-color:var(--line-strong); box-shadow:0 0 0 4px rgba(255,122,31,.08); }
.vd-more{ margin-top:16px; border-radius:var(--r-md); border:1px dashed var(--line-strong); background:var(--bg-2); }
.vd-more.open{ border-style:solid; border-color:var(--line); }
.vd-more-t{ display:flex; align-items:center; gap:8px; width:100%; min-height:44px; padding:10px 12px 10px 14px; text-align:left; font-size:14.5px; font-weight:650; color:var(--text); }
.vd-more-t > svg{ width:16px; height:16px; flex:none; color:var(--accent-2); }
.vd-more-t > svg:last-child{ margin-left:auto; color:var(--faint); transition:transform .35s var(--spring); }
.vd-more-t small{ min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:12.5px; font-weight:500; color:var(--faint); }
.vd-more.open .vd-more-t > svg:last-child{ transform:rotate(180deg); }
.vd-more-b{ display:none; padding:2px 14px 14px; }
.vd-more.open .vd-more-b{ display:block; animation:fadeDown .35s var(--ease-out); }
.vd-more-b .blk:first-child{ margin-top:4px; }
/* Formular */
.vd-form .chips.wrapy{ gap:6px; }
/* ---- denken ---- */
/* Abstände */
.dk-gap{ margin-top:14px; }
.dk-how{ margin-top:22px; }
.dk-how > .howto{ margin:0; }
.dk-how ol li + li{ margin-top:4px; }
.dk-tools{ margin-bottom:12px; }
.dk-none{ display:flex; align-items:center; gap:10px; padding:14px 16px; border-radius:var(--r-md); border:1px dashed var(--line-strong); color:var(--muted); font-size:14.5px; }
.dk-none svg{ width:17px; height:17px; flex:none; color:var(--accent-2); }

/* Kennzahlen: eine schmale Zeile, keine großen Kacheln */

/* Ziele: nächste Etappe direkt auf der Karte */

.dk-step .box{ transition:background .2s, border-color .2s, transform .3s var(--spring); }

.dk-next .dk-step.dk-gone{ animation:dkGone .55s var(--ease-out) .12s forwards; }

.dk-first{ display:inline-flex; align-items:center; gap:7px; padding:7px 13px 7px 10px; border-radius:999px; border:1px dashed var(--line-strong); color:var(--accent-2); font-size:13.5px; font-weight:600; transition:background .2s; }

const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);

  const d = parseISO(s); d.setDate(d.getDate() + 3 - (d.getDay()+6)%7);

}

const EASE = { out:'cubic-bezier(.16,1,.3,1)', soft:'cubic-bezier(.22,.8,.24,1)', inOut:'cubic-bezier(.65,0,.35,1)', in:'cubic-bezier(.55,0,1,.45)', spring:'cubic-bezier(.34,1.56,.64,1)', back:'cubic-bezier(.34,1.3,.64,1)' };
const E = {
  lin:t=>t, inQ:t=>t*t, outQ:t=>1-(1-t)*(1-t), outC:t=>1-Math.pow(1-t,3), inC:t=>t*t*t,
  inOutC:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, outE:t=>t>=1?1:1-Math.pow(2,-10*t), inE:t=>t<=0?0:Math.pow(2,10*t-10),
  inOutE:t=>t<=0?0:t>=1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2, inOutS:t=>-(Math.cos(Math.PI*t)-1)/2,
  outB:t=>{ const c1=1.70158, c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); },
  outEl:t=>{ if(t<=0||t>=1) return clamp(t); return Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI)/3)+1; }
};
const seg = (t, a, d) => clamp((t - a) / d);
function anim(el, kf, o={}){

  if(reduce){ opts.duration = 1; opts.delay = 0; }

}
function staggerIn(els, o={}){
  const {y=22, x=0, blur=8, rot=0, scale=1, dur=620, gap=45, delay=0} = o;
  return Promise.all([...els].map((el, i) => anim(el, [
    {opacity:0, transform:`translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`, filter:`blur(${blur}px)`},
    {opacity:1, transform:'none', filter:'blur(0px)'}

}
function splitWords(el){
  if(!el) return [];
  const walk = node => {
    [...node.childNodes].forEach(n => {
      if(n.nodeType === 3){
        const frag = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach(p => {
          if(!p) return;
          if(/^\s+$/.test(p)) frag.append(document.createTextNode(p));
          else { const s = document.createElement('span'); s.className = 'w'; s.textContent = p; frag.append(s); }
        });
        node.replaceChild(frag, n);
      } else if(n.nodeType === 1 && !n.classList.contains('w')){
        if(n.classList.contains('gt') || n.classList.contains('serif-it')) n.classList.add('w'); else walk(n);
      }
    });
  };
  walk(el);
  return $$('.w', el);
}

/* ---------------- FX layer: Funken, Glut, Auflösen ---------------- */
const FX = (() => {
  const cv = $('#fx'), ctx = cv.getContext('2d');
  let W = 0, H = 0, parts = [], running = false, last = 0;
  function size(){ const dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  size(); addEventListener('resize', size);
  function loop(now){
    const dt = Math.min(3, (now - last) / 16.67 || 1); last = now;
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    parts = parts.filter(p => p(now, dt));
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    if(parts.length) requestAnimationFrame(loop); else { running = false; ctx.clearRect(0,0,W,H); }
  }
  function add(p){ parts.push(p); if(!running){ running = true; last = performance.now(); requestAnimationFrame(loop); } }
  const COLORS = ['#FFD9A8','#FFB25B','#FF7A1F','#FF4E2A'];
  function spark(x, y, a, v, life, w, color, grav=.05, drag=.955){
    const t0 = performance.now(); let px = x, py = y, vx = Math.cos(a)*v, vy = Math.sin(a)*v;
    add((now, dt) => {
      const k = Math.max(0, (now - t0) / life); if(k >= 1) return false;
      const ox = px, oy = py;
      vx *= Math.pow(drag, dt); vy = vy*Math.pow(drag, dt) + grav*dt; px += vx*dt; py += vy*dt;
      ctx.globalAlpha = (1-k)*(1-k);
      ctx.strokeStyle = color; ctx.lineWidth = w*(1-k*.6); ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ox - vx*1.6, oy - vy*1.6); ctx.lineTo(px, py); ctx.stroke();
      return true;
    });
  }
  function burst(x, y, o={}){
    if(reduce) return;
    const {n=26, speed=6, life=900, w=2.2, spread=Math.PI*2, dir=-Math.PI/2, grav=.06} = o;
    for(let i = 0; i < n; i++){
      const a = spread >= Math.PI*2 ? Math.random()*Math.PI*2 : dir + (Math.random()-.5)*spread;
      spark(x, y, a, speed*(.35 + Math.random()*.85), life*(.55 + Math.random()*.6), w*(.6 + Math.random()*.8), COLORS[i % COLORS.length], grav);
    }
    ring(x, y, {r:o.ring ?? 46});
  }
  function ring(x, y, o={}){
    if(reduce) return;
    const {r=46, life=650, w=2, color='255,160,90'} = o; const t0 = performance.now();
    add(now => {
      const k = (now - t0)/life; if(k >= 1) return false; if(k < 0) return true; const e = E.outC(k);
      ctx.globalAlpha = (1-k)*.9; ctx.strokeStyle = `rgba(${color},1)`; ctx.lineWidth = w*(1-k)+.4;
      ctx.beginPath(); ctx.arc(x, y, 4 + r*e, 0, Math.PI*2); ctx.stroke(); return true;
    });
  }
  function embers(rect, o={}){
    if(reduce) return;
    const {n=40, life=1400} = o;
    for(let i = 0; i < n; i++){
      const t0 = performance.now() + Math.random()*180; let px = rect.left + Math.random()*rect.width, py = rect.top + Math.random()*rect.height;
      const vx = (Math.random()-.3)*.9, vy = -(.4 + Math.random()*1.3), r = .8 + Math.random()*2, L = life*(.5+Math.random()*.7), c = COLORS[i%COLORS.length];
      let ph = Math.random()*6;
      add((now, dt) => {
        if(now < t0) return true;
        const k = (now - t0)/L; if(k >= 1) return false;
        ph += .08*dt; px += (vx + Math.sin(ph)*.35)*dt; py += vy*dt;
        ctx.globalAlpha = Math.sin(Math.PI*Math.min(1, k*1.3))*.95; ctx.fillStyle = c;
        ctx.beginPath(); ctx.arc(px, py, r*(1-k*.5), 0, Math.PI*2); ctx.fill(); return true;
      });
    }
  }
  function dissolve(el){
    if(!el) return Promise.resolve();
    const r = el.getBoundingClientRect();
    embers(r, {n: Math.min(90, Math.round(r.width*r.height/500)), life:1200});
    return anim(el, [{opacity:1, filter:'blur(0)', clipPath:'inset(0 0 0 0 round 18px)'}, {opacity:0, filter:'blur(6px)', clipPath:'inset(0 0 0 100% round 18px)'}], {duration:520, easing:EASE.inOut, fill:'forwards'});
  }
  function trail(points, o={}){
    if(reduce) return;
    const {life=700, color='255,178,91', w=3} = o; const t0 = performance.now();
    add(now => {
      const k = (now - t0)/life; if(k >= 1) return false;
      ctx.lineCap = 'round';
      for(let i = 1; i < points.length; i++){
        const f = i/points.length; ctx.globalAlpha = f*(1-k)*.9; ctx.strokeStyle = `rgba(${color},1)`; ctx.lineWidth = w*f;
        ctx.beginPath(); ctx.moveTo(points[i-1][0], points[i-1][1]); ctx.lineTo(points[i][0], points[i][1]); ctx.stroke();
      }
      return true;
    });
  }
  return {burst, ring, embers, dissolve, trail};
})();

/* Ein Element fliegt im Bogen von A nach B (Keynote-artig). */
function flyGhost({from, to, html, cls='ghost-fly', arc=-90, dur=780, scaleTo=.35}){
  if(reduce || !from || !to) return Promise.resolve();
  const g = document.createElement('div'); g.className = cls; g.innerHTML = html;
  g.style.left = from.left + 'px'; g.style.top = from.top + 'px';
  document.body.append(g);
  const gw = g.offsetWidth, gh = g.offsetHeight;
  const sx = 0, sy = 0, ex = (to.left + to.width/2) - (from.left + gw/2), ey = (to.top + to.height/2) - (from.top + gh/2);
  const cx = ex/2, cy = Math.min(sy, ey) + arc;
  const kf = []; const pts = [];
  for(let i = 0; i <= 24; i++){
    const t = i/24, e = E.inOutC(t);
    const x = (1-e)*(1-e)*sx + 2*(1-e)*e*cx + e*e*ex, y = (1-e)*(1-e)*sy + 2*(1-e)*e*cy + e*e*ey;
    const s = lerp(1, scaleTo, E.inC(t)), rot = Math.sin(t*Math.PI)*-8;
    kf.push({transform:`translate(${x}px, ${y}px) rotate(${rot}deg) scale(${s})`, opacity: t > .85 ? (1-t)/.15 : 1, offset:t});
    pts.push([from.left + gw/2 + x, from.top + gh/2 + y]);
  }
  return anim(g, kf, {duration:dur, easing:'linear', fill:'forwards'}).then(() => {
    g.remove(); FX.trail(pts.slice(-10), {life:400}); FX.burst(to.left + to.width/2, to.top + to.height/2, {n:22, speed:5, life:700});
  });
}

}
const TIP = $('#tip');
function showTip(el, x, y){
  const d = el.getAttribute('data-tip'); if(!d) return;
  const [head, ...rows] = d.split('|');
  TIP.innerHTML = `<div class="td">${esc(head)}</div>` + rows.map(r => { const [c, v] = r.split('~'); return `<div class="tv">${c ? `<i style="background:${esc(c)}"></i>` : ''}<span>${esc(v)}</span></div>`; }).join('');
  TIP.classList.add('show');
  const tw = TIP.offsetWidth, th = TIP.offsetHeight;
  let lx = x + 14, ly = y - th - 12;
  if(lx + tw > innerWidth - 8) lx = x - tw - 14;
  if(ly < 8) ly = y + 16;
  TIP.style.left = Math.max(8, lx) + 'px'; TIP.style.top = ly + 'px';
}
document.addEventListener('pointermove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if(el) showTip(el, e.clientX, e.clientY); else TIP.classList.remove('show'); }, {passive:true});
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if(el){ const r = el.getBoundingClientRect(); showTip(el, r.left + r.width/2, r.top); } });
document.addEventListener('focusout', () => TIP.classList.remove('show'));
