 {t:'Lernfallen erkennen', s:'Was sich produktiv anfühlt, aber wenig bringt.', ev:3,
  why:'Markieren, Wiederlesen und Abschreiben fühlen sich nach Arbeit an. In Studien schneiden sie schwach ab. Das nennt man Illusion von Kompetenz.',
  steps:['Markieren nur, um danach Fragen daraus zu machen.','Statt Wiederlesen: abfragen.','Statt Mitschrift abschreiben: aus dem Kopf neu aufschreiben.'],
  trap:'Vertrautheit mit Können verwechseln. „Kenn ich“ heißt nicht „kann ich“.',
  ex:'Kannst du die Seite ohne Hinsehen erklären? Wenn nicht, hast du sie nur wiedererkannt.'}
],

modelle:[
 {t:'Inversion', s:'Frag umgekehrt.', cat:'Probleme lösen',
  idea:'Statt „Wie werde ich besser?“ fragst du: „Was würde mich garantiert schlechter machen?“ Dann lässt du genau das weg. Fehler zu vermeiden ist oft leichter, als Genialität zu erzwingen.',
  when:'Wenn du festhängst oder ein Ziel zu groß wirkt.',
  steps:['Ziel aufschreiben.','Fragen: Wie würde ich es sicher verfehlen?','Liste der Fehler machen.','Jeden Punkt in eine Regel umdrehen.'],
  ex:'Was macht einen 8er unbrauchbar? Nie anspielbar sein, im Zentrum den Ball verlieren, nach Ballverlust stehen bleiben. Umgedreht ist das dein Trainingsplan.'},
 {t:'Zweite Ordnung', s:'Und was passiert danach?', cat:'Entscheiden',
  idea:'Die meisten denken nur an die erste Folge einer Entscheidung. Gute Entscheider fragen weiter: Was folgt aus der Folge? Viele schlechte Entscheidungen fühlen sich sofort gut an und rächen sich zwei Schritte später.',
  when:'Bei allem, was sich kurzfristig gut anfühlt.',
  steps:['Erste Folge aufschreiben.','Fragen: Und dann? Mindestens zweimal.','Prüfen, ob die späteren Folgen die erste aufwiegen.'],
  ex:'Bis zwei Uhr zocken: jetzt Spaß, morgen müde, schwaches Training, weniger Spielzeit.'},
 {t:'80/20-Prinzip', s:'Wenig Ursache, viel Wirkung.', cat:'Strategie',
  idea:'Oft bringt ein kleiner Teil deiner Arbeit den Großteil des Ergebnisses. Die Zahlen sind eine Faustregel, das Prinzip gilt erstaunlich oft.',
  when:'Wenn du zu viel auf einmal willst oder keine Zeit hast.',
  steps:['Alle Aufgaben oder Aktivitäten auflisten.','Markieren, welche wenigen das meiste bringen.','Denen deine beste Zeit geben, den Rest kürzen oder streichen.'],
  ex:'Vor einer Arbeit bringen die drei Hauptthemen der letzten Stunden meist mehr Punkte als Randthemen aus dem Buch.'},
 {t:'Opportunitätskosten', s:'Jedes Ja ist ein Nein.', cat:'Entscheiden',
  idea:'Die echten Kosten einer Sache sind das, was du stattdessen hättest tun können. Eine Stunde Scrollen kostet nicht nichts, sondern die beste Alternative für diese Stunde.',
  when:'Vor Zusagen, Käufen und Zeitfressern.',
  steps:['Fragen: Was ist die beste Alternative?','Beides ehrlich vergleichen.','Bewusst entscheiden statt nebenbei.'],
  ex:'300 € für Sneaker sind auch 300 € weniger für Equipment, einen Kurs oder Startkapital.'},
 {t:'Pre-Mortem', s:'Das Scheitern vorher durchspielen.', cat:'Strategie',
  idea:'Bevor du etwas startest, tust du so, als wäre es ein halbes Jahr später gescheitert, und schreibst auf, warum. Was dir sofort einfällt, sind deine größten Risiken. Jetzt sind sie noch vermeidbar.',
  when:'Vor Projekten, Saisonzielen und wichtigen Prüfungen.',
  steps:['Vorstellen: Es ist schiefgegangen.','Fünf Gründe aufschreiben.','Für die zwei wahrscheinlichsten Gründe eine Gegenmaßnahme festlegen.'],
  ex:'Website-Business gescheitert? Vielleicht, weil nie jemand aktiv angesprochen wurde. Gegenmaßnahme: jede Woche fünf Betriebe anschreiben.'},
 {t:'Kompetenzkreis', s:'Wisse, was du nicht weißt.', cat:'Entscheiden',
  idea:'Jeder hat Bereiche, in denen er wirklich Ahnung hat, und viele, in denen er nur glaubt, Ahnung zu haben. Innerhalb des Kreises darfst du schnell entscheiden. Außerhalb langsamer, und du fragst Leute, die es wirklich wissen.',
  when:'Bei Geld, Gesundheit, Recht und allem, was neu ist.',
  steps:['Ehrlich fragen: Habe ich das schon einmal selbst gemacht?','Wenn nein: Wer weiß es wirklich?','Klein anfangen, bis der Kreis gewachsen ist.'],
  ex:'Geldanlage nach Tipps aus Social Media heißt, außerhalb des Kreises zu entscheiden.'},
 {t:'Asymmetrische Wetten', s:'Kleiner Einsatz, großer möglicher Gewinn.', cat:'Strategie',
  idea:'Such Gelegenheiten, bei denen du wenig verlieren, aber viel gewinnen kannst: eine Bewerbung, eine Nachricht an jemanden, von dem du lernen willst, ein Nebenprojekt mit kaum Kosten.',
  when:'Wenn Angst vor Ablehnung dich bremst.',
  steps:['Schlimmsten Fall ehrlich benennen.','Besten Fall benennen.','Wenn der schlimmste Fall klein ist: machen.'],
  ex:'Ein Probetraining bei einem höheren Verein: schlimmstenfalls ein Abend, bestenfalls ein Karriereschritt.'},
 {t:'Zinseszins-Effekt', s:'Kleine Schritte, die sich stapeln.', cat:'Strategie',
  idea:'Was sich jeden Tag ein bisschen verbessert, wächst nicht gleichmäßig, sondern beschleunigt. Das gilt für Geld, aber genauso für Wissen, Fähigkeiten und Beziehungen. Wer früh anfängt, hat den größten Hebel.',
  when:'Wenn sich Fortschritt zu langsam anfühlt.',
  steps:['Eine kleine tägliche Handlung wählen.','So klein machen, dass du sie nie ausfallen lässt.','Erst nach Monaten bewerten.'],
  ex:'Jeden Tag zehn Minuten Ballarbeit mit dem schwachen Fuß sind über ein Jahr rund 60 Stunden.'},
 {t:'Umkehrbar oder nicht?', s:'Zwei Arten von Entscheidungen.', cat:'Entscheiden',
  idea:'Entscheidungen, die du leicht rückgängig machen kannst, triffst du schnell. Bei Entscheidungen, die schwer umkehrbar sind, nimmst du dir Zeit. Viele verschwenden Energie, weil sie beides gleich behandeln.',
  when:'Immer, wenn du lange grübelst.',
  steps:['Fragen: Kann ich das in einer Woche rückgängig machen?','Wenn ja: entscheiden und testen.','Wenn nein: drüber schlafen, Infos sammeln, jemanden fragen.'],
  ex:'Ein neues Lernsystem testen: schnell entscheiden. Einen Vertrag über zwei Jahre: drüber schlafen.'},
 {t:'Erste Prinzipien', s:'Zurück zu dem, was sicher stimmt.', cat:'Probleme lösen',
  idea:'Statt zu kopieren, wie es alle machen, zerlegst du ein Problem in seine Grundbausteine und baust die Lösung neu auf.',
  when:'Wenn „so macht man das eben“ die einzige Begründung ist.',
  steps:['Problem aufschreiben.','Annahmen sammeln und fragen: Ist das wirklich wahr?','Nur mit dem weiterarbeiten, was sicher stimmt.','Daraus eine eigene Lösung bauen.'],
  ex:'„Für ein Business braucht man viel Geld.“ Was braucht ein Website-Service wirklich? Laptop, Können, Kunden. Zwei davon hast du schon.'},
 {t:'Eisenhower-Matrix', s:'Wichtig ist nicht dasselbe wie dringend.', cat:'Strategie',
  idea:'Dringende Dinge schreien, wichtige Dinge flüstern. Wer nur auf Dringendes reagiert, kommt nie zu dem, was ihn wirklich weiterbringt.',
  when:'Wenn der Kopf voll ist und alles gleichzeitig ansteht.',
  steps:['Wichtig und dringend: sofort erledigen.','Wichtig, nicht dringend: fest einplanen. Hier passiert Entwicklung.','Dringend, nicht wichtig: kurz halten oder abgeben.','Weder noch: streichen.'],
  ex:'Für die Arbeit in drei Wochen lernen ist wichtig, aber nicht dringend. Genau deshalb gehört es heute in den Kalender.'},
 {t:'Anreize verstehen', s:'Zeig mir den Anreiz, ich zeig dir das Verhalten.', cat:'Menschen',
  idea:'Menschen reagieren auf Anreize, oft ohne es zu merken. Wer verstehen will, warum jemand etwas tut oder empfiehlt, fragt zuerst: Was hat er davon?',
  when:'Bei Werbung, Tipps, Verhandlungen und Empfehlungen.',
  steps:['Fragen: Wer verdient daran?','Fragen: Was würde die Person sagen, wenn sie nichts davon hätte?','Die Empfehlung entsprechend gewichten.'],
  ex:'Ein Finfluencer, der Provision für Trading-Apps bekommt, findet Trading natürlich super.'},
 {t:'Hanlons Rasiermesser', s:'Nicht gleich böse Absicht unterstellen.', cat:'Menschen',
  idea:'Vieles, was nach Absicht aussieht, ist eher Stress, Unwissen oder Zufall. Wer nicht sofort Böses unterstellt, bleibt ruhiger und klärt Konflikte schneller.',
  when:'Wenn du dich über jemanden ärgerst.',
  steps:['Mindestens zwei harmlose Erklärungen suchen.','Nachfragen statt vorwerfen.','Erst bei Wiederholung von Absicht ausgehen.'],
  ex:'Der Mitspieler passt nicht zu dir. Vielleicht hat er dich nicht gesehen, weil du im Deckungsschatten standest.'},
 {t:'10/10/10-Regel', s:'Drei Zeitebenen für eine Entscheidung.', cat:'Entscheiden',
  idea:'Wie wirst du dich mit dieser Entscheidung in 10 Minuten fühlen, in 10 Monaten und in 10 Jahren? Das holt dich aus dem Moment heraus.',
  when:'Bei emotionalen Entscheidungen.',
  steps:['Entscheidung formulieren.','Für jede Zeitebene einen Satz schreiben.','Der langfristigen Ebene mehr Gewicht geben.'],
  ex:'Training schwänzen, weil es regnet: in 10 Minuten angenehm, in 10 Monaten bereut, in 10 Jahren Teil einer Gewohnheit.'},
 {t:'Sicherheitsmarge', s:'Plane Puffer ein.', cat:'Strategie',
  idea:'Dinge dauern länger und kosten mehr als gedacht. Wer Puffer einplant, bleibt handlungsfähig, wenn etwas schiefgeht.',
  when:'Bei Zeitplänen, Geld und Projekten.',
  steps:['Ehrlich schätzen.','Zeit mal 1,5 nehmen, Geld plus 20 Prozent.','Mit dem Puffer planen, nicht mit der Wunschzahl.'],
  ex:'Referat am Freitag: Plane, am Mittwoch fertig zu sein.'},
 {t:'Die Karte ist nicht das Gebiet', s:'Modelle vereinfachen die Wirklichkeit.', cat:'Probleme lösen',
  idea:'Jede Statistik, jeder Plan und jede Taktiktafel ist eine Vereinfachung. Nützlich, aber nie die ganze Wahrheit. Gute Denker prüfen, wo ihre Karte nicht mehr passt.',
  when:'Wenn Plan und Realität auseinanderlaufen.',
  steps:['Fragen: Was lässt dieses Modell weg?','Mit echten Beobachtungen abgleichen.','Plan anpassen statt die Realität zu ignorieren.'],
  ex:'Der Matchplan sieht Pressing über außen vor. Spielt der Gegner immer durch die Mitte, muss sich das Team anpassen.'}
],

denkfehler:[
 {t:'Bestätigungsfehler', s:'Wir suchen, was wir eh glauben.', what:'Wir achten auf Infos, die unsere Meinung bestätigen, und übersehen den Rest.',
  spot:'Du suchst nur nach Gründen, warum deine Idee gut ist.', fix:'Aktiv nach der stärksten Gegenmeinung suchen. Frag: Was müsste passieren, damit ich falsch liege?',
  ex:'Du hältst einen Trainer für unfair und merkst dir nur Situationen, die das bestätigen.'},
 {t:'Versunkene Kosten', s:'Weitermachen, nur weil man schon investiert hat.', what:'Je mehr Zeit oder Geld wir schon hineingesteckt haben, desto schwerer fällt das Aufhören, auch wenn es sinnlos geworden ist.',
  spot:'Der Satz „Jetzt habe ich schon so viel …“.', fix:'Nur nach vorn schauen: Würde ich heute neu einsteigen, mit dem Wissen von jetzt?',
  ex:'Ein schlechtes Spiel zu Ende zocken, weil man schon zwei Stunden drin ist.'},
 {t:'Ankereffekt', s:'Die erste Zahl färbt alles danach.', what:'Die erste Zahl, die wir hören, beeinflusst unsere Schätzung, auch wenn sie willkürlich ist.',
  spot:'Ein „Statt 199 € nur 99 €“-Preisschild.', fix:'Vor Verhandlungen und Käufen eigene Vergleichswerte recherchieren.',
  ex:'Beim Verhandeln kannst du den Anker selbst setzen: Nenn deinen Preis zuerst, wenn du gut vorbereitet bist.'},
 {t:'Verfügbarkeitsfehler', s:'Was leicht einfällt, wirkt häufiger.', what:'Was spektakulär oder frisch im Kopf ist, halten wir für wahrscheinlicher, als es ist.',
  spot:'Du schätzt Risiken nach Schlagzeilen oder Videos ein.', fix:'Nach echten Zahlen fragen: Wie oft passiert das wirklich?',
  ex:'Nach drei Videos über Krypto-Millionäre wirkt schneller Reichtum normal. Die Verlierer drehen keine Videos.'},
 {t:'Überlebensirrtum', s:'Wir sehen nur die Gewinner.', what:'Wir schauen auf die, die es geschafft haben, und übersehen die vielen, die dasselbe gemacht haben und gescheitert sind.',
  spot:'„Er hat die Schule abgebrochen und ist Millionär geworden.“', fix:'Fragen: Wie viele haben das Gleiche versucht, und was wurde aus ihnen?',
  ex:'Einzelne Profis ohne Schulabschluss beweisen nicht, dass Schule egal ist. Die meisten Talente werden keine Profis.'},
 {t:'Selbstüberschätzung', s:'Wir halten uns für besser, als wir sind.', what:'Die meisten schätzen ihr Können und ihre Prognosen zu optimistisch ein, besonders am Anfang.',
  spot:'Große Sicherheit bei wenig Erfahrung.', fix:'Vorhersagen aufschreiben und später prüfen. Feedback von Leuten holen, die ehrlich sind.',
  ex:'Nach drei guten Trades fühlt man sich wie ein Profi. Oft war es Glück, nicht Können.'},
 {t:'Planungsfehlschluss', s:'Alles dauert länger als geplant.', what:'Wir planen den besten Fall und vergessen Störungen, Pausen und Unvorhergesehenes.',
  spot:'„Das schaffe ich locker an einem Abend.“', fix:'Fragen: Wie lange hat es letztes Mal wirklich gedauert? Dann Puffer draufrechnen.',
  ex:'Referat „schnell am Sonntag“. Am Sonntag fehlt dann die Hälfte der Infos.'},
 {t:'Rückschaufehler', s:'Hinterher wusste man es immer schon.', what:'Nach einem Ereignis glauben wir, es sei vorhersehbar gewesen. Das macht uns zu streng mit uns selbst und zu sicher bei der nächsten Prognose.',
  spot:'„Das war doch klar!“', fix:'Vorher aufschreiben, was du erwartest. Das Entscheidungs-Journal macht genau das.',
  ex:'Nach einer Niederlage wirkt die Aufstellung offensichtlich falsch. Vorher fand sie jeder gut.'},
 {t:'Herdentrieb', s:'Machen, was alle machen.', what:'Wenn viele etwas tun, halten wir es automatisch für richtig.',
  spot:'Hype, Zeitdruck, „alle haben das schon“.', fix:'Fragen: Würde ich das auch tun, wenn es niemand sonst täte?',
  ex:'Ein Coin steigt, alle in der Gruppe kaufen. Wer zuletzt kauft, kauft oft am teuersten.'},
 {t:'Spielerfehlschluss', s:'Der Zufall hat kein Gedächtnis.', what:'Nach fünfmal Rot glauben wir, jetzt müsse Schwarz kommen. Unabhängige Zufallsereignisse gleichen sich aber nicht aus.',
  spot:'„Jetzt ist es aber mal dran.“', fix:'Fragen: Hängt das nächste Ereignis wirklich vom letzten ab?',
  ex:'Nach mehreren Verlusten beim Trading die Einsätze erhöhen, weil „jetzt ein Gewinn kommen muss“.'},
 {t:'Attributionsfehler', s:'Bei anderen der Charakter, bei uns die Umstände.', what:'Machen andere einen Fehler, liegt es an ihnen. Machen wir einen, lag es an der Situation.',
  spot:'Schnelle Urteile über Mitspieler oder Lehrer.', fix:'Die gleiche Nachsicht, die du für dich hast, auch anderen geben.',
  ex:'Der Mitspieler wirkt faul. Vielleicht ist er angeschlagen oder hat gerade Stress zu Hause.'},
 {t:'Ergebnis-Denken', s:'Gute Entscheidung ist nicht gleich gutes Ergebnis.', what:'Wir bewerten Entscheidungen nach dem Ausgang. Dabei kann eine gute Entscheidung Pech haben und eine schlechte Glück.',
  spot:'„Hat funktioniert, also war es richtig.“', fix:'Fragen: War die Entscheidung mit dem Wissen von damals gut begründet?',
  ex:'Ein riskanter Hackenpass kommt einmal an. Trotzdem ist er im eigenen Strafraum eine schlechte Entscheidung.'}
],

mental:[
 {t:'Kontrolle sortieren', s:'Energie nur auf das, was du steuerst.', cat:'Fokus',
  why:'Gedanken an Dinge, die du nicht beeinflussen kannst, fühlen sich wichtig an, bringen aber nichts außer Druck.',
  steps:['Zwei Spalten: kontrollierbar und nicht kontrollierbar.','Aufstellung, Schiri, Wetter, Gegner: rechte Spalte.','Vorbereitung, Einsatz, Reaktion, Körpersprache: linke Spalte.','Nur die linke Spalte bekommt deine Aufmerksamkeit.'],
  ex:'Ob du startest, entscheidet der Trainer. Wie du dich im Training zeigst, entscheidest du.'},
 {t:'Fehler-Reset', s:'Ein Ritual, dann die nächste Aktion.', cat:'Rückschläge',
  why:'Der zweite Fehler entsteht meistens, weil man im Kopf noch beim ersten ist. Ein festes Ritual holt dich zurück ins Jetzt.',
  steps:['Kurz ausatmen.','Ein festes Wort sagen oder denken, zum Beispiel „Weiter“.','Blick auf den nächsten Ball oder die nächste Aufgabe.'],
  ex:'Fehlpass im Zentrum: sofort Gegenpressing statt Kopfschütteln.'},
 {t:'Nervosität umdeuten', s:'Aufregung ist Energie.', cat:'Druck',
  why:'Herzklopfen vor einem Spiel fühlt sich körperlich ähnlich an wie Vorfreude. Studien zur Umdeutung von Stress zeigen: Wer Aufregung als Energie sieht, schneidet oft besser ab als jemand, der sich zur Ruhe zwingt.',
  steps:['Aufregung bemerken, nicht bekämpfen.','Innerlich sagen: „Mein Körper macht sich bereit.“','Die Energie auf die erste Aktion lenken.'],
  ex:'Vor dem Anpfiff: „Ich bin aufgeregt, weil es mir wichtig ist. Gut so.“'},
 {t:'Prozessziele', s:'Ziele, die du selbst erfüllen kannst.', cat:'Fokus',
  why:'„Ich muss gut spielen“ erzeugt Druck und sagt dir nicht, was du tun sollst. Zwei, drei konkrete Aufgaben kannst du erfüllen, egal wie das Spiel ausgeht.',
  steps:['Vor dem Spiel zwei oder drei Handlungen festlegen.','Konkret und beobachtbar formulieren.','Nach dem Spiel ehrlich abhaken, im Spieltagebuch.'],
  ex:'Vor jedem Anspiel ein Schulterblick. Nach Ballverlust fünf Sekunden Gegenpressing.'},
 {t:'Doppelt einatmen', s:'Der schnellste Weg, runterzukommen.', cat:'Druck',
  why:'Zweimal kurz durch die Nase einatmen, dann lang durch den Mund ausatmen. Das lange Ausatmen beruhigt spürbar und geht unauffällig, auch auf dem Platz.',
  steps:['Tief durch die Nase einatmen.','Kurz nachatmen, ebenfalls durch die Nase.','Lang und langsam durch den Mund ausatmen.','Ein- bis dreimal wiederholen.'],
  ex:'In der Trinkpause, vor einem Elfmeter oder vor der ersten Aufgabe einer Klassenarbeit.'},
 {t:'Mit dir reden wie mit einem Mitspieler', s:'Selbstgespräch mit Abstand.', cat:'Druck',
  why:'Unter Druck hilft es, dich mit „du“ oder deinem Namen anzusprechen. Der Abstand macht es leichter, klar zu denken, statt im Gefühl festzuhängen.',
  steps:['Negativen Gedanken bemerken.','In die zweite Person übersetzen.','Wie ein guter Kapitän sprechen: kurz, konkret, nach vorn.'],
  ex:'„Komm, nächster Ball“ statt „Ich bin so schlecht heute“.'},
 {t:'Von der Bank kommen', s:'Bereit sein, wenn es zählt.', cat:'Druck',
  why:'Als Einwechselspieler entscheiden die ersten Minuten viel. Wer das Spiel von der Bank aus aktiv liest, ist sofort drin.',
  steps:['Von der Bank analysieren: Wo sind Räume? Wer presst wie?','Warm bleiben und dich in Bewegung halten.','Die ersten zwei Aktionen bewusst einfach halten.','Dann das Risiko dosiert steigern.'],
  ex:'Ersten Ball sicher spielen, dann erst den vertikalen Pass suchen.'},
 {t:'Vergleich mit gestern', s:'Der einzige faire Vergleich.', cat:'Selbstvertrauen',
  why:'Andere haben andere Voraussetzungen, Trainer und Körper. Der Vergleich, der dir wirklich etwas sagt: Bist du besser als vor drei Monaten?',
  steps:['Einmal im Monat aufschreiben, was jetzt besser klappt.','Abendberichte und Spieltagebuch durchsehen.','Fortschritt benennen, auch wenn er klein ist.'],
  ex:'Im Oktober musstest du an den Schulterblick denken, im Januar passiert er automatisch.'},
 {t:'Wenn-Dann-Pläne', s:'Vorsätze, die wirklich halten.', cat:'Fokus',
  why:'Ein Vorsatz mit konkretem Auslöser wird deutlich öfter umgesetzt als ein allgemeiner Wunsch. Das gehört zu den am besten belegten Techniken der Motivationsforschung.',
  steps:['Kritische Situation benennen: Wenn …','Die Handlung festlegen: dann …','So konkret wie möglich: Ort, Zeit, Auslöser.'],
  ex:'Wenn ich von der Schule nach Hause komme, dann lege ich das Handy in die Küche und starte einen Fokusblock.'},
 {t:'Mentales Training', s:'Im Kopf trainieren, bevor es zählt.', cat:'Selbstvertrauen',
  why:'Wer Bewegungen und Situationen lebhaft im Kopf durchspielt, bereitet Gehirn und Körper darauf vor. Am besten wirkt es, wenn es sich so echt wie möglich anfühlt.',
  steps:['Ruhig hinsetzen, Augen zu.','Eine konkrete Spielsituation aus deiner Perspektive durchspielen: sehen, hören, fühlen.','Die gelungene Ausführung im echten Tempo vorstellen.','Drei bis fünf Wiederholungen, wenige Minuten.'],
  ex:'Schulterblick, offene Annahme, Pass zwischen die Linien. Mehrmals, am Abend vor dem Spiel.'},
 {t:'Beweis-Bank', s:'Selbstvertrauen aus Belegen statt aus Hoffnung.', cat:'Selbstvertrauen',
  why:'Selbstvertrauen wächst am stabilsten aus echten Erfahrungen. Wer seine starken Momente sammelt, kann sie vor wichtigen Situationen nachlesen.',
  steps:['Nach jedem starken Moment einen Satz notieren.','Konkret bleiben: was genau, gegen wen, wie.','Vor wichtigen Spielen oder Prüfungen drei Einträge lesen.'],
  ex:'„Gegen den Tabellenführer 90 Minuten jeden Ball gefordert und zwei Torvorlagen.“ Im Tab Beweis-Bank sammelst du solche Momente.'},
 {t:'Mit Kritik umgehen', s:'Die Information herausziehen, die Bewertung liegen lassen.', cat:'Rückschläge',
  why:'Kritik vom Trainer oder Lehrer enthält meistens eine nützliche Information, verpackt in ein unangenehmes Gefühl. Wer die Information herausholt, wird schneller besser.',
  steps:['Zuhören, nicht sofort verteidigen.','Nachfragen: Was genau soll ich anders machen?','Die Information aufschreiben, das Gefühl gehen lassen.','Im nächsten Training sichtbar umsetzen.'],
  ex:'„Du bist zu langsam im Umschalten.“ Nachfrage: „Meinst du nach Ballverlust oder nach Ballgewinn?“'},
 {t:'Nach Niederlagen', s:'Fühlen erlaubt, dann analysieren.', cat:'Rückschläge',
  why:'Ärger nach einer Niederlage ist normal. Wer ihn sofort wegdrückt oder tagelang darin hängen bleibt, lernt wenig. Eine feste Reihenfolge hilft.',
  steps:['Am Abend: Gefühl zulassen, nichts entscheiden.','Am nächsten Tag drei Fragen: Was lief gut? Was lief schlecht? Was mache ich anders?','Eine Sache fürs nächste Training mitnehmen.'],
  ex:'Nach dem 0:3 erst am nächsten Morgen ins Spieltagebuch schreiben, nicht direkt in der Kabine.'},
 {t:'Fokuswort', s:'Ein Wort, das dich zurückholt.', cat:'Fokus',
  why:'Ein kurzes, festes Wort lenkt die Aufmerksamkeit sofort auf das, was gerade zählt. Es funktioniert, weil du es vorher trainiert hast.',
  steps:['Ein Wort wählen, das für deine Hauptaufgabe steht.','Im Training immer wieder nutzen.','Im Spiel in kritischen Momenten innerlich sagen.'],
  ex:'„Scan“ vor jeder Ballannahme oder „Jagen“ direkt nach Ballverlust.'}
],

fussball:[
 {t:'Schulterblick vor der Annahme', s:'Wer vorher schaut, hat mehr Zeit.', cat:'Mit Ball',
  why:'Forschung zu Profis zeigt: Mittelfeldspieler, die vor der Ballannahme häufiger scannen, spielen öfter erfolgreich nach vorn. Du weißt dann schon, wo Gegner, Mitspieler und Räume sind, bevor der Ball kommt.',
  cues:['Zwei bis drei kurze Blicke, während der Pass zu dir unterwegs ist.','Über beide Schultern, besonders in den Rücken.','Ein letzter Blick kurz bevor der Ball ankommt.'],
  drill:'Rondo mit Zusatzregel: Ein Partner zeigt hinter dir Finger hoch. Du sagst die Zahl an, bevor du den Ball weiterspielst.',
  ex:'Xavi und andere Weltklasse-Achter wurden genau dafür bekannt: ständig den Kopf drehen.'},
 {t:'Offene Körperstellung', s:'Halb offen anbieten, nach vorn annehmen.', cat:'Mit Ball',
  why:'Wer frontal zum Passgeber steht, sieht nur die Hälfte des Feldes. Leicht seitlich und halb geöffnet siehst du beide Richtungen und kannst mit dem ersten Kontakt aufdrehen.',
  cues:['Hüfte leicht zum gegnerischen Tor gedreht.','Ball mit dem hinteren Fuß annehmen.','Der erste Kontakt bringt den Ball in die Richtung, in die du spielen willst.'],
  drill:'Passdreieck: Ball kommt von links, Annahme mit dem rechten, hinteren Fuß, Weiterspiel nach rechts vorn. Dann Seiten tauschen.',
  ex:'Ballannahme im Halbraum: offen stehen und mit dem ersten Kontakt am Gegenspieler vorbei aufdrehen.'},
 {t:'Erster Kontakt mit Absicht', s:'Der erste Kontakt entscheidet die nächsten zwei Sekunden.', cat:'Mit Ball',
  why:'Ein Kontakt, der den Ball nur stoppt, gibt dem Gegner Zeit. Ein Kontakt in den freien Raum verschafft dir Zeit.',
  cues:['Vor der Annahme wissen, wohin der erste Kontakt geht.','Weg vom Druck, möglichst nach vorn.','Ball nah am Fuß, aber nicht unter dem Körper.'],
  drill:'Partnerpässe: Jeder Kontakt muss in ein vorher angesagtes Hütchentor gehen.',
  ex:'Gegner kommt von rechts: erster Kontakt nach links vorn mit der Außenseite.'},
 {t:'Dritter Mann', s:'Über den Umweg in den Rücken der Abwehr.', cat:'Mit Ball',
  why:'Ist der direkte Pass zugestellt, findet der Ball über einen dritten Spieler den Weg. Der Klatschpass zieht den Gegner an, der dritte Mann startet in den frei werdenden Raum.',
  cues:['Erkennen, wann dein Gegenspieler auf den Ball geht.','Ablegen und sofort starten.','Laufweg in den Rücken des herausrückenden Gegners.'],
  drill:'Drei Spieler im Dreieck: A spielt auf B, B legt auf C ab, C spielt den tiefen Ball auf den startenden A.',
  ex:'Du spielst in den Fuß des Stürmers, er legt auf den Sechser ab, du startest und bekommst den Ball in den Lauf.'},
 {t:'Spielverlagerung', s:'Den Ball dahin, wo der Gegner nicht ist.', cat:'Mit Ball',
  why:'Verschiebt der Gegner auf eine Seite, entsteht auf der anderen Raum. Ein schneller Seitenwechsel bestraft das, bevor er wieder geordnet ist.',
  cues:['Beim Scannen auch die ballferne Seite prüfen.','Seitenwechsel flach und scharf oder diagonal hoch.','Nach dem Pass nachrücken.'],
  drill:'Spielform mit zwei Toren pro Seite: Ein Treffer zählt doppelt nach einem Seitenwechsel innerhalb von drei Pässen.',
  ex:'Der Gegner presst rechts mit vier Mann: Diagonalball auf den linken Außenverteidiger.'},
 {t:'Tempo und Rhythmus', s:'Schnell, wenn es eng wird. Ruhig, wenn du Zeit hast.', cat:'Mit Ball',
  why:'Gute Achter wechseln das Tempo bewusst. Unter Druck spielen sie direkt, mit Zeit halten sie den Ball kurz, um Gegner anzulocken und Räume zu öffnen.',
  cues:['Druck von hinten: direkt klatschen lassen.','Zeit und Raum: aufdrehen und andribbeln.','Gegner anlocken, dann den freien Mitspieler finden.'],
  drill:'Rondo mit wechselnder Kontaktregel: Der Trainer ruft „eins“ oder „frei“.',
  ex:'Mit Ball in den Raum dribbeln, bis der gegnerische Sechser rausrückt, dann in seinen Rücken passen.'},
 {t:'Zwischen den Linien anbieten', s:'Im Raum zwischen Mittelfeld und Abwehr des Gegners.', cat:'Ohne Ball',
  why:'Zwischen der Mittelfeld- und der Abwehrreihe des Gegners ist es schwer zu verteidigen. Wer dort anspielbar ist, kann das Spiel mit einer Drehung beschleunigen.',
  cues:['Aus dem Deckungsschatten des Gegners herausgehen.','Im Halbraum stehen, nicht direkt hinter einem Gegenspieler.','Offene Körperstellung, um aufdrehen zu können.'],
  drill:'Spielform mit Zonen: Ein Tor zählt nur, wenn der Ball vorher in der Zone zwischen den Linien war.',
  ex:'Ein paar Meter seitlich verschieben, damit die Passlinie vom Innenverteidiger frei wird.'},
 {t:'Räume für andere schaffen', s:'Laufen, um den Gegner zu bewegen.', cat:'Ohne Ball',
  why:'Nicht jeder Lauf soll den Ball bekommen. Manche Läufe ziehen einen Gegenspieler weg und öffnen so den Raum für einen Mitspieler.',
  cues:['Erkennen, wohin der Ball gehen soll.','Mit einem Lauf den Gegenspieler aus genau diesem Raum ziehen.','Auch ohne Ball zufrieden sein, wenn es funktioniert.'],
  drill:'Profi-Spiele anschauen und darauf achten, wie oft der Achter tief geht, damit der Zehner frei wird.',
  ex:'Du startest in die Spitze, dein Gegenspieler läuft mit, und der Zehner hat Platz für den Abschluss.'},
 {t:'Box-to-Box mit Timing', s:'Spät in den Strafraum kommen.', cat:'Ohne Ball',
  why:'Wer früh im Strafraum steht, ist leicht zu decken. Ein später Lauf aus dem Rückraum ist schwer zu verfolgen.',
  cues:['Erst starten, wenn der Ball auf dem Flügel ist.','Den Raum am Elfmeterpunkt oder den Rückraum anpeilen.','Nach Ballverlust sofort umschalten.'],
  drill:'Flankenübung mit Startsignal: Der Achter startet erst, wenn der Flügelspieler den Ball annimmt.',
  ex:'Flanke von rechts, du kommst spät von hinten und schließt aus dem Rückraum ab.'},
 {t:'Gegenpressing', s:'Die ersten Sekunden nach Ballverlust.', cat:'Gegen den Ball',
  why:'Direkt nach einem Ballverlust ist der Gegner noch ungeordnet. Wer sofort Druck macht, gewinnt den Ball oft hoch und nah am Tor zurück.',
  cues:['Der nächste Spieler attackiert sofort den Ball.','Die anderen schließen die kurzen Passwege.','Etwa fünf bis sechs Sekunden voller Einsatz, dann geordnet zurückfallen.'],
  drill:'Spielform: Eine Rückeroberung innerhalb von fünf Sekunden nach Ballverlust zählt wie ein Tor.',
  ex:'Fehlpass im Zentrum: nicht ärgern, sofort auf den Ballführer.'},
 {t:'Pressing-Auslöser', s:'Wann es sich lohnt, draufzugehen.', cat:'Gegen den Ball',
  why:'Pressing ohne Auslöser kostet Kraft und reißt Lücken. Mit klaren Signalen läuft das ganze Team gleichzeitig an.',
  cues:['Rückpass zum Torwart oder Innenverteidiger.','Schlechte Ballannahme oder ein hoher, langsamer Ball.','Gegner mit dem Rücken zum Tor.','Ball am Flügel nahe der Seitenlinie.'],
  drill:'Der Trainer gibt Auslöser vor. Beim Signal läuft das Team gemeinsam an.',
  ex:'Der gegnerische Sechser nimmt mit dem Rücken zu dir an: Druck von hinten, ohne Foul.'},
 {t:'Deckungsschatten', s:'Zwei Gegner auf einmal verteidigen.', cat:'Gegen den Ball',
  why:'Läufst du den Ballführer so an, dass dein Körper die Passlinie hinter dir blockiert, verteidigst du zwei Gegner gleichzeitig.',
  cues:['Im Bogen anlaufen statt gerade.','Den Passweg zum gefährlichsten Gegenspieler im Rücken schließen.','Den Ballführer auf die Seite lenken, wo dein Team in Überzahl ist.'],
  drill:'2-gegen-1-Spielform: Der Verteidiger punktet nur, wenn er den Pass auf den zweiten Spieler verhindert.',
  ex:'Du läufst den Innenverteidiger so an, dass der gegnerische Sechser in deinem Rücken nicht angespielt werden kann.'},
 {t:'Restverteidigung', s:'Absichern, während das Team angreift.', cat:'Gegen den Ball',
  why:'Konter entstehen, wenn beim eigenen Angriff niemand absichert. Ein mitdenkender Achter steht so, dass ein Ballverlust nicht sofort gefährlich wird.',
  cues:['Rückt der Sechser auf, bleibst du eher hinten.','Den gefährlichsten Konterspieler im Blick behalten.','Zentral stehen, nicht nur ballorientiert mitlaufen.'],
  drill:'Angriffsübung mit sofortigem Gegenangriff nach Ballverlust: Wer sichert ab?',
  ex:'Euer Außenverteidiger geht mit nach vorn. Du schiebst rüber und sicherst seine Seite ab.'},
 {t:'Zweikampf: stehen bleiben', s:'Verzögern statt reinspringen.', cat:'Gegen den Ball',
  why:'Wer zu früh in den Zweikampf geht, wird leicht ausgespielt. Verzögern gibt deinen Mitspielern Zeit, dir zu helfen.',
  cues:['Seitlich stehen, Gewicht auf den Fußballen.','Auf den Ball schauen, nicht auf Körpertäuschungen.','Gegner nach außen lenken, bei schlechtem Kontakt zugreifen.'],
  drill:'1-gegen-1 auf kleinem Feld: Der Verteidiger punktet, wenn er den Angreifer fünf Sekunden aufhält.',
  ex:'Konter des Gegners: Du gehst nicht drauf, du verzögerst, bis zwei Mitspieler da sind.'},
 {t:'Coaching und Kommunikation', s:'Ein Achter redet.', cat:'Kopf',
  why:'Mitspieler sehen nicht alles. Kurze, klare Kommandos verschaffen ihnen Zeit und verhindern Fehler.',
  cues:['Kurz und eindeutig: „Zeit“, „Mann“, „Dreh“, „Klatsch“.','Positiv nach Fehlern von Mitspielern.','Laut genug, auch wenn es sich ungewohnt anfühlt.'],
  drill:'Im Training eine Einheit lang bei jedem Pass ein Kommando geben.',
  ex:'„Zeit!“ für den Mitspieler, der nicht unter Druck steht. Er dreht auf, statt zurückzuspielen.'},
 {t:'Spiel lesen', s:'Zwei Pässe voraus denken.', cat:'Kopf',
  why:'Gute Spieler sind nicht nur schneller, sie sind früher da. Sie erkennen Muster und ahnen, wohin der Ball als Nächstes geht.',
  cues:['Fragen: Wo wird der Ball in zwei Pässen sein?','Muster des Gegners erkennen: Wohin spielt er unter Druck?','Position vorher anpassen, nicht hinterherlaufen.'],
  drill:'Ein Profi-Spiel schauen und vor jedem Pass ansagen, wohin er gehen müsste.',
  ex:'Der Gegner spielt unter Druck immer auf seinen Linksverteidiger. Du stehst schon da, bevor der Ball kommt.'},
 {t:'Belastung steuern', s:'Mehr Training ist nicht automatisch besser.', cat:'Körper',
  why:'Leistung entsteht aus Belastung plus Erholung. Plötzliche starke Sprünge der Wochenbelastung hängen in Studien mit mehr Verletzungen zusammen. Im Abendbericht wird deine Trainingslast aus Dauer mal Anstrengung berechnet.',
  cues:['Belastung langsam steigern, nicht sprunghaft.','Nach harten Tagen einen lockeren Tag einplanen.','Warnsignale ernst nehmen: Müdigkeit, Schmerzen, schlechter Schlaf.'],
  drill:'Nach jedem Training im Abendbericht Dauer und Anstrengung eintragen und den Verlauf in den Trends beobachten.',
  ex:'Liga, Zusatztraining und Schulsport in einer Woche: Dann lieber das Zusatztraining kürzen.'},
 {t:'Schlaf und Regeneration', s:'Im Schlaf wirst du besser.', cat:'Körper',
  why:'Im Schlaf erholen sich Muskeln und Nervensystem, und neue Bewegungen werden gefestigt. Für Jugendliche werden 8 bis 10 Stunden empfohlen.',
  cues:['Feste Schlafenszeiten, auch am Wochenende.','Vor wichtigen Spielen nicht spät aufbleiben.','Dunkles, kühles Zimmer und das Handy außer Reichweite.'],
  drill:'Zwei Wochen lang die Schlafdauer im Abendbericht eintragen und mit deiner Energie vergleichen.',
  ex:'Freitag vor dem Spiel: Handy um 22 Uhr weg, Licht um 22:30 Uhr aus.'},
 {t:'Essen am Spieltag', s:'Volle Speicher ohne vollen Bauch.', cat:'Körper',
  why:'Kohlenhydrate sind der Hauptbrennstoff im Fußball. Wer rechtzeitig isst und genug trinkt, hat in der zweiten Halbzeit mehr Energie.',
  cues:['Letzte größere Mahlzeit etwa drei bis vier Stunden vor Anpfiff.','Kohlenhydratreich und gut verträglich, zum Beispiel Nudeln, Reis oder Brot.','Über den Tag verteilt trinken.','Nach dem Spiel bald essen: Kohlenhydrate und Eiweiß.'],
  drill:'Bei den nächsten Spielen notieren, was du gegessen hast und wie deine Energie war.',
  ex:'Anpfiff 15 Uhr: Mittagessen um 11:30 Uhr, um 13:30 Uhr eine Banane.'},
 {t:'Kraft und Athletik', s:'Stärker werden, sicher und mit Technik.', cat:'Körper',
  why:'Krafttraining im Jugendalter gilt unter fachkundiger Anleitung als sicher und sinnvoll. Es macht dich explosiver, stabiler im Zweikampf und weniger verletzungsanfällig.',
  cues:['Technik vor Gewicht.','Erst mit dem eigenen Körpergewicht: Kniebeugen, Ausfallschritte, Liegestütze, Rumpf.','Zusatzgewichte nur mit Anleitung von Trainer oder Athletiktrainer.'],
  drill:'Zweimal pro Woche 20 Minuten Körpergewichtsübungen nach dem Training.',
  ex:'Starke Beine und ein stabiler Rumpf helfen dir, im Zweikampf stehen zu bleiben und schneller anzutreten.'},
 {t:'Verletzungen vorbeugen', s:'Ein gutes Aufwärmprogramm wirkt.', cat:'Körper',
  why:'Strukturierte Aufwärmprogramme wie FIFA 11+ haben in Studien Verletzungen im Fußball deutlich reduziert, wenn sie regelmäßig gemacht werden.',
  cues:['Aufwärmen ernst nehmen, nicht nur locker kicken.','Übungen für Sprunggelenk, Knie und hintere Oberschenkel.','Auch Landen und Abbremsen üben.'],
  drill:'FIFA 11+ einmal komplett lernen und zweimal pro Woche vor dem Training machen.',
  ex:'Nordic Hamstrings und einbeinige Kniebeugen sind Teil vieler Präventionsprogramme.'}
],

ki:[
 {t:'Kontext ist alles', s:'Die KI weiß nur, was du ihr sagst.', cat:'Prompting',
  idea:'Ein Modell kennt deine Situation nicht. Je klarer du Ziel, Hintergrund, Zielgruppe und Grenzen beschreibst, desto besser passt die Antwort.',
  steps:['Wer bist du, und worum geht es?','Was ist das Ziel?','Für wen ist das Ergebnis?','Was soll es nicht sein?'],
  ex:'Schwach: „Erklär Fotosynthese.“ Stark: „Ich bin in der 10. Klasse und schreibe Freitag eine Bio-Arbeit. Erklär mir die Fotosynthese in fünf Schritten und stell mir danach drei Prüfungsfragen.“'},
 {t:'Aufgabe präzise formulieren', s:'Klare Verben, klarer Umfang.', cat:'Prompting',
  idea:'„Mach mal was zu …“ führt zu durchschnittlichen Antworten. Klare Aufgaben mit Umfang und Kriterien führen zu brauchbaren.',
  steps:['Ein klares Verb: analysiere, vergleiche, erkläre, kürze, bewerte.','Den Umfang festlegen: Anzahl, Länge, Tiefe.','Qualitätskriterien nennen: Was macht die Antwort gut?'],
  ex:'„Vergleiche diese zwei Trainingspläne nach Belastung, Erholung und Schulalltag. Höchstens 150 Wörter, am Ende eine Empfehlung.“'},
 {t:'Beispiele zeigen', s:'Ein Beispiel sagt mehr als drei Regeln.', cat:'Prompting',
  idea:'Willst du ein bestimmtes Format oder einen Stil, zeig ein Beispiel. Die KI orientiert sich stark daran. Der Fachbegriff ist Few-Shot-Prompting.',
  steps:['Ein oder zwei gute Beispiele einfügen.','Kennzeichnen, was übernommen werden soll: Stil, Länge, Aufbau.','Darauf achten, dass die Beispiele nicht zu ähnlich sind, sonst kopiert die KI sie.'],
  ex:'„Schreib Karteikarten genau in diesem Format: Frage: … | Antwort: … Hier zwei Beispiele: …“'},
 {t:'Format vorgeben', s:'Sag, wie das Ergebnis aussehen soll.', cat:'Prompting',
  idea:'Tabelle, Stichpunkte, Schritt-für-Schritt-Plan oder JSON: Gibst du das Format vor, kannst du das Ergebnis direkt nutzen.',
  steps:['Format nennen.','Struktur vorgeben, zum Beispiel Spalten oder Überschriften.','Länge begrenzen.'],
  ex:'„Antworte als Tabelle mit den Spalten Tag, Lernthema, Dauer, Methode.“'},
 {t:'Rückfragen erlauben', s:'Lass die KI fragen, bevor sie rät.', cat:'Prompting',
  idea:'Fehlen wichtige Infos, rät die KI und klingt dabei trotzdem sicher. Erlaube ihr ausdrücklich, zuerst nachzufragen.',
  steps:['Am Ende des Prompts: „Stell mir zuerst bis zu drei Fragen, wenn etwas unklar ist.“','Die Fragen beantworten.','Erst dann das Ergebnis erstellen lassen.'],
  ex:'Bei einem Trainingsplan fragt Claude dann nach Trainingstagen, Spieltag und Schulzeiten, statt sie zu erfinden.'},
 {t:'Kritik einfordern', s:'Keine Bestätigung, sondern ehrliches Feedback.', cat:'Prompting',
  idea:'KI-Modelle neigen dazu, freundlich zu sein. Willst du echte Kritik, musst du sie ausdrücklich verlangen.',
  steps:['Eine Rolle vergeben: „Sei ein strenger, ehrlicher Kritiker.“','Konkret fragen: Was ist die größte Schwäche?','Nach Gegenargumenten fragen.'],
  ex:'„Hier ist meine Business-Idee. Nenn mir die drei wahrscheinlichsten Gründe, warum sie scheitert.“'},
 {t:'Iterieren statt neu anfangen', s:'Gute Ergebnisse entstehen in Runden.', cat:'Workflows',
  idea:'Die erste Antwort ist ein Entwurf. Profis verbessern in mehreren Runden, statt bei einer schwachen Antwort aufzugeben.',
  steps:['Die erste Antwort lesen und genau sagen, was fehlt.','Einzelne Teile gezielt verbessern lassen.','Am Ende eine saubere Endfassung anfordern.'],
  ex:'„Teil 2 ist zu allgemein. Mach ihn konkret für einen Achter in der U17 mit drei Trainingseinheiten pro Woche.“'},
 {t:'Prompt-Ketten', s:'Große Aufgaben in Schritte zerlegen.', cat:'Workflows',
  idea:'Komplexe Aufgaben gelingen besser in mehreren Schritten. Jeder Schritt baut auf dem vorherigen auf und lässt sich einzeln prüfen.',
  steps:['Recherche: Was ist bekannt?','Gliederung: Wie baue ich es auf?','Entwurf: Teil für Teil.','Kritik: Was ist schwach?','Überarbeitung.'],
  ex:'Referat: erst die Gliederung prüfen lassen, dann jeden Abschnitt einzeln, dann eine Gesamtkritik.'},
 {t:'Ergebnisse prüfen', s:'KI klingt sicher, auch wenn sie falsch liegt.', cat:'Prüfen',
  idea:'Sprachmodelle können Fakten, Zahlen und Quellen erfinden. Das nennt man Halluzination. Je wichtiger die Info, desto genauer musst du prüfen.',
  steps:['Zahlen, Daten und Zitate immer gegenprüfen.','Nach Quellen fragen und sie wirklich öffnen.','Bei aktuellen Themen offizielle Seiten nutzen.','Bei Mathe den Rechenweg nachrechnen.'],
  ex:'Ein Gesetz, ein Preis oder eine Spielerstatistik von der KI ist ein Hinweis, kein Beweis.'},
 {t:'Wann KI nicht hilft', s:'Ein starkes Werkzeug für viele Dinge, nicht für alle.', cat:'Prüfen',
  idea:'KI ist stark beim Erklären, Strukturieren, Entwerfen und Feedbackgeben. Schwach ist sie bei Dingen, die du selbst können musst, bei privaten Daten und bei Entscheidungen, die Menschen betreffen.',
  steps:['Hausaufgaben nicht schreiben lassen, sonst fehlt das Können in der Arbeit.','Keine Passwörter oder privaten Daten anderer eingeben.','Bei Gesundheit, Recht und Geld echte Experten fragen.','Wichtige persönliche Entscheidungen mit Menschen besprechen.'],
  ex:'Die KI kann dir einen Aufsatz erklären und Feedback geben. Schreiben musst du ihn selbst, sonst lernst du nichts.'},
 {t:'Mit KI lernen', s:'Tutor statt Lösungsautomat.', cat:'Lernen mit KI',
  idea:'Richtig eingesetzt ist KI ein geduldiger Privatlehrer: Sie erklärt, fragt dich ab und gibt Feedback. Falsch eingesetzt nimmt sie dir genau die Arbeit ab, die das Lernen ausmacht.',
  steps:['Erklären lassen, dann selbst in eigenen Worten wiederholen.','Abfragen lassen statt Lösungen holen.','Um Hinweise bitten statt um die fertige Lösung.','Eigene Lösungen prüfen lassen.'],
  ex:'„Gib mir keine Lösung. Gib mir einen Hinweis für den nächsten Schritt.“'},
 {t:'Agenten und Tools', s:'Wenn KI nicht nur schreibt, sondern handelt.', cat:'Workflows',
  idea:'Moderne KI kann Werkzeuge nutzen: im Web suchen, Code ausführen, Dateien bearbeiten oder über Konnektoren andere Dienste ansprechen. Ein Agent plant Schritte, nutzt Werkzeuge und prüft Zwischenergebnisse.',
  steps:['Ziel und Grenzen klar vorgeben.','Zwischenschritte prüfen, statt blind zu vertrauen.','Nur die Zugriffe geben, die wirklich nötig sind.'],
  ex:'Dieses Dashboard ist ein Beispiel: Es holt über den vidIQ-Konnektor das Transkript eines Videos und lässt Claude daraus eine Zusammenfassung schreiben.'},
 {t:'Datenschutz und Sicherheit', s:'Was nicht in einen Prompt gehört.', cat:'Prüfen',
  idea:'Was du eingibst, verlässt dein Gerät. Private Daten anderer, Passwörter und vertrauliche Infos gehören nicht in einen Chat.',
  steps:['Keine Passwörter, Kontodaten oder Ausweisnummern.','Daten anderer Menschen anonymisieren.','Bei Kundenprojekten vorher klären, was du teilen darfst.'],
  ex:'Statt „Max Müller aus der 10b hat …“ lieber „ein Mitschüler hat …“.'},
 {t:'Den eigenen Stil behalten', s:'KI als Verstärker, nicht als Ersatz.', cat:'Lernen mit KI',
  idea:'Wer jeden Text von der KI schreiben lässt, klingt bald wie alle anderen und verlernt, selbst zu formulieren. Nutze sie für Feedback und Ideen, nicht als Ghostwriter.',
  steps:['Zuerst selbst einen Entwurf schreiben.','Feedback einholen: Was ist unklar, was ist stark?','Selbst überarbeiten.'],
  ex:'„Hier ist mein Text. Markiere die drei unklarsten Sätze und sag mir warum, aber schreib sie nicht um.“'}
],

vorlagen:[
 {t:'Lerncoach-Quiz', cat:'lernen', why:'Abfragen statt Wiederlesen, mit steigender Schwierigkeit und einer Lückenanalyse am Ende.',
  text:'Du bist mein Lerncoach für [Fach], [Klassenstufe]. Thema: [Thema].\nStell mir 10 Fragen, immer nur eine. Warte auf meine Antwort, bewerte sie kurz und erkläre Fehler. Steigere die Schwierigkeit langsam.\nAm Ende: Nenne meine 3 größten Lücken und wie ich sie schließe.'},
 {t:'Feynman-Partner', cat:'lernen', why:'Du erklärst, Claude findet die Lücken. Hinweise statt Lösungen halten das Lernen bei dir.',
  text:'Ich erkläre dir gleich [Thema] in eigenen Worten. Prüf meine Erklärung wie ein strenger Lehrer: Was ist falsch, was fehlt, was ist ungenau?\nStell mir danach 3 Fragen, die meine Lücken aufdecken. Gib mir Hinweise, keine fertige Lösung.'},
 {t:'Idee kritisch prüfen', cat:'business', why:'Feste Struktur und die Bitte um Ehrlichkeit verhindern reine Bestätigung.',
  text:'Hier ist meine Business-Idee: [Idee].\nAnalysiere sie nach: Kern, Potenzial, Probleme, Realismus für einen Schüler ohne Startkapital, Verbesserung, nächster konkreter Schritt.\nSei ehrlich und kritisch. Keine Motivationssprüche.'},
 {t:'Spielanalyse', cat:'fussball', why:'Ursache statt Symptom, und am Ende genau eine konkrete Übung.',

const COLS = ['notes','videos','entries','reports','exams','focus','matches','decisions','settings','reviews','goals','money'];
const S = { cols:null, ready:false, offline:false, loaded:new Set(), view:'home', tab:{}, open:new Set(), q:{}, f:{}, more:{}, fresh:null, nav:false, pendingRender:false, showDone:false };
COLS.forEach(c => { S[c] = []; });
const CAP = { sample:null, mcp:null, sampleP:Promise.resolve(null), mcpP:Promise.resolve(null) };
const ACT = {}, INP = {}, CHG = {};
/* Register: Bereichsdateien (s_*.js) tragen hier ihre Renderer, Tab-Zähler und Wissens-Teile ein. */
const RENDER = {}, TABCOUNT = {}, WISSEN = {};

function initCaps(){
  if(!window.claude || !window.claude.use) return;
  CAP.sampleP = window.claude.use('sample').then(s => (CAP.sample = s || null)).catch(() => null);
  CAP.mcpP = window.claude.use('mcp').then(m => (CAP.mcp = m || null)).catch(() => null);
}
async function connect(){
  try{
    if(!window.claude || !window.claude.use) return setOffline();
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db || !user) return setOffline();
    const uid = await user.id();
    if(!uid) return setOffline();
    const base = db.doc('data/users/' + uid + '/space');
    S.cols = {};
    COLS.forEach(n => { S.cols[n] = base.collection(n); });
    COLS.forEach(n => S.cols[n].onSnapshot(snap => {
      S[n] = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
      S.loaded.add(n);
      if(!S.ready && S.loaded.size === COLS.length) S.ready = true;
      scheduleRender();
    }, err => {
      const c = err && err.code;
      if(c === 'revoked' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') setOffline();
      else { S.loaded.add(n); if(S.loaded.size === COLS.length) S.ready = true; scheduleRender(); }
    }));
  }catch(e){ setOffline(); }
}
function setOffline(){ S.offline = true; S.ready = true; $('#offline').hidden = false; scheduleRender(); }

const wq = new Map();
function queued(key, fn){
  const prev = wq.get(key) || Promise.resolve();
  const p = prev.catch(() => {}).then(fn);
  wq.set(key, p);
  p.catch(() => {}).finally(() => { if(wq.get(key) === p) wq.delete(key); });
  return p;
}
function need(){ if(!S.cols){ const e = new Error('offline'); e.code = 'offline'; throw e; } }
async function dbAdd(col, data){ need(); const ref = S.cols[col].doc(); await queued(col+'/'+ref.id, () => ref.set(data)); return ref.id; }
async function dbSet(col, id, data){ need(); return queued(col+'/'+id, () => S.cols[col].doc(id).set(data)); }
async function dbUpd(col, id, data){ need(); return queued(col+'/'+id, () => S.cols[col].doc(id).update(data)); }
async function dbDel(col, id){ need(); return queued(col+'/'+id, () => S.cols[col].doc(id).delete()); }
function failMsg(e){
  const c = e && e.code;
  if(c === 'offline') return 'Speichern geht gerade nicht. Öffne das Dashboard angemeldet in der Claude-App.';
  if(c === 'quota_exceeded') return 'Speicher voll. Lösch ein paar alte Einträge.';
  if(c === 'invalid_argument') return 'Dieser Eintrag ist zu groß oder kann nicht gespeichert werden.';
  if(c === 'resource_exhausted') return 'Zu viele Änderungen auf einmal. Warte kurz.';
  return 'Konnte nicht speichern. Versuch es gleich nochmal.';
}
const failed = e => toast(failMsg(e), 'info');
const stripId = o => { const c = Object.assign({}, o); delete c.id; return c; };
const find = (col, id) => (S[col] || []).find(x => x.id === id);
const cut = (s, n) => { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };

function prefs(){ return S.settings.find(d => d.id === 'prefs') || {}; }
function habitsList(){ const h = prefs().habits; return Array.isArray(h) && h.length ? h : DEFAULT_HABITS; }
function routineOf(key){ const r = prefs().routines && prefs().routines[key]; return Array.isArray(r) && r.length ? r : ROUTINES[key].phases; }
async function savePrefs(patch){ const cur = S.settings.find(d => d.id === 'prefs'); await dbSet('settings', 'prefs', Object.assign({}, cur ? stripId(cur) : {}, patch)); }

/* ---------------- Rendering-Takt ---------------- */
let rq = 0, renderHold = 0;
function hold(ms){ renderHold++; setTimeout(() => { renderHold--; if(!renderHold && S.pendingRender){ S.pendingRender = false; scheduleRender(); } }, ms); }
function scheduleRender(){
  if(rq) return;
  rq = requestAnimationFrame(() => {
    rq = 0;
    if(renderHold){ S.pendingRender = true; return; }
    renderHome();
    if(S.view !== 'home') renderView();
  });
}
function preserve(root, fn){
  const act = document.activeElement, actId = act && root.contains(act) ? act.id : null;
  let ss = null, se = null;
  try{ if(actId && 'selectionStart' in act){ ss = act.selectionStart; se = act.selectionEnd; } }catch(e){}
  const vals = {};
  $$('input[id], textarea[id]', root).forEach(el => { if(el.type !== 'range' && el.type !== 'checkbox') vals[el.id] = el.value; });
  const st = root.scrollTop;
  fn();
  Object.entries(vals).forEach(([id, v]) => { const el = document.getElementById(id); if(el && root.contains(el) && !el.hasAttribute('data-fresh-value') && el.value !== v) el.value = v; });
  if(actId){ const el = document.getElementById(actId); if(el){ try{ el.focus({preventScroll:true}); if(ss != null) el.setSelectionRange(ss, se); }catch(e){} } }
  root.scrollTop = st;
}

function ghostAt(el){
  const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
  const g = el.cloneNode(true); g.removeAttribute('id'); g.className = 'morph-ghost';

  const src = $$('svg', el); $$('svg', g).forEach((s, i) => { const o = src[i] && src[i].getBoundingClientRect(); if(o){ s.style.width = o.width + 'px'; s.style.height = o.height + 'px'; } });
  document.body.append(g); g._r = r; return g;
}
const flipFrom = (g, from, dur=640) => { const r = g._r, s = from.height / r.height; return anim(g, [{transform:`translate(${from.left - r.left}px, ${from.top - r.top}px) scale(${s})`}, {transform:'none'}], {duration:dur, easing:EASE.inOut}); };

/* Erkennt Datum und Uhrzeit in freiem Text. */
const WD = ['sonntag','montag','dienstag','mittwoch','donnerstag','freitag','samstag'], WDS = ['so','mo','di','mi','do','fr','sa'];
function parseWhen(text){
  const t = ' ' + String(text || '').toLowerCase() + ' ', today = todayISO();
  const B = '(?:^|[^a-zäöüß0-9])', A = '(?=$|[^a-zäöüß0-9])', rx = s => new RegExp(B + s + A);
  let date = null, time = null, m;
  if(rx('übermorgen').test(t)) date = addDays(today, 2);
  else if(rx('morgen').test(t)) date = addDays(today, 1);
  else if(rx('heute').test(t) || rx('heut').test(t)) date = today;
  else if((m = t.match(rx('in (\\d{1,2}) tag(?:en)?')))) date = addDays(today, +m[1]);
  else if((m = t.match(rx('in (\\d{1,2}) wochen?')))) date = addDays(today, 7 * +m[1]);
  else if(rx('nächste woche').test(t) || rx('naechste woche').test(t)){ const d = parseISO(today); date = addDays(today, 7 - (d.getDay()+6)%7); }
  else if((m = t.match(/(?:^|\D)(\d{1,2})\.(\d{1,2})\.(\d{2,4})?/))){
    const day = +m[1], mon = +m[2]; let y = m[3] ? +m[3] : new Date().getFullYear(); if(y < 100) y += 2000;
    let c = new Date(y, mon-1, day);
    if(c.getMonth() === mon-1 && c.getDate() === day){ if(!m[3] && iso(c) < today) c = new Date(y+1, mon-1, day); date = iso(c); }
  } else {
    for(let i = 0; i < 7; i++){
      if(rx(WD[i]).test(t) || rx('(?:am|ab|bis|nächsten|kommenden) ' + WDS[i] + '\\.?').test(t)){
        const d = parseISO(today); let diff = (i - d.getDay() + 7) % 7; if(diff === 0) diff = 7; date = addDays(today, diff); break;
      }
    }
  }
  if((m = t.match(/(?:^|\D)(\d{1,2}):(\d{2})(?!\d)/))){ if(+m[1] < 24 && +m[2] < 60) time = pad(+m[1]) + ':' + m[2]; }
  else if((m = t.match(/(?:^|\D)(\d{1,2})(?:[.:](\d{2}))?\s?uhr/))){ if(+m[1] < 24 && (!m[2] || +m[2] < 60)) time = pad(+m[1]) + ':' + (m[2] || '00'); }
  return {date, time};
}

const NB_KW = (raw => { const o = {}; Object.entries(raw).forEach(([k, g]) => { o[k] = {}; Object.entries(g).forEach(([c, r]) => { o[k][c] = {eq:nbW(r[0]), pre:nbW(r[1]), end:nbW(r[2])}; }); }); return o; })({

    business:['business call kunde shop onlineshop pitch', 'kunden meeting umsatz gewerbe startup marketing investor firma auftrag website webseite newsletter kooperation sponsor lieferant', 'meeting']
  },
  irgendwann:{
    buch:['buch bücher lesen ebook roman', 'hörbuch', 'buch bücher roman'],
    film:['film filme doku dokus dokumentation serie serien kino netflix staffel anime', 'film', 'film filme serie doku'],
    projekt:['projekt bauen app website programmieren coden gründen entwickeln', 'projekt', 'projekt'],

  }

function nbCatOf(text, kind){
  const rules = NB_KW[kind === 'anstehend' ? 'anstehend' : 'irgendwann'];
  const toks = String(text || '').toLowerCase().split(/[^a-zäöüß0-9]+/).filter(Boolean);
  const hit = Object.keys(rules).filter(c => { const r = rules[c]; return toks.some(t => r.eq.includes(t) || r.pre.some(p => t.startsWith(p)) || r.end.some(p => t.endsWith(p))); });
  return hit.length === 1 ? hit[0] : '';
}
const nbCatLabel = k => ([...NOTE_CATS, ...SOMEDAY_CATS].find(c => c[0] === k) || [0, ''])[1];
const nbDot = k => NB_COL[k] ? `<i class="nb-dot" style="background:${NB_COL[k]}"></i>` : '';
/* Erweitert parseWhen: „Fr“, „12.11“, „in zwei Wochen“, „in 2 Monaten“, „Wochenende“, „um 18“. */
function nbWhen(text){
  const w = parseWhen(text), t = ' ' + String(text || '').toLowerCase() + ' ', today = todayISO();
  const B = '(?:^|[^a-zäöüß0-9])', A = '(?=$|[^a-zäöüß0-9])';
  let m;
  if(!w.date){
    if((m = t.match(new RegExp(B + 'in (' + Object.keys(NB_NUM).join('|') + '|\\d{1,2}) (tag|tagen|woche|wochen|monat|monaten)' + A)))){
      const n = NB_NUM[m[1]] || +m[1], u = m[2];
      if(u.startsWith('tag')) w.date = addDays(today, n);
      else if(u.startsWith('woche')) w.date = addDays(today, 7 * n);
      else { const d = parseISO(today), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); w.date = iso(d); }
    }
    else if(new RegExp(B + 'wochenende' + A).test(t)){ const dow = parseISO(today).getDay(); w.date = dow === 6 || dow === 0 ? today : addDays(today, 6 - dow); }
    else if((m = t.match(/(?:^|[^\d.])(\d{1,2})\.(\d{1,2})(?![\d.])(?!\s?uhr)/))){
      const day = +m[1], mon = +m[2], y = parseISO(today).getFullYear(); let c = new Date(y, mon - 1, day);
      if(mon >= 1 && mon <= 12 && c.getMonth() === mon - 1 && c.getDate() === day){ if(iso(c) < today) c = new Date(y + 1, mon - 1, day); w.date = iso(c); }
    }
    else for(let i = 1; i < 7; i++){
      if(new RegExp(B + NB_WD[i] + '\\.?' + A).test(t)){ let diff = (i - parseISO(today).getDay() + 7) % 7; if(diff === 0) diff = 7; w.date = addDays(today, diff); break; }
    }
  }
  if(!w.time && (m = t.match(new RegExp(B + 'um (\\d{1,2})(?:[:.](\\d{2}))?' + A))) && +m[1] < 24 && (!m[2] || +m[2] < 60)) w.time = pad(+m[1]) + ':' + (m[2] || '00');
  return w;
}
/* Schnell-Eingabe auswerten. NB.off enthält ignorierte Erkennungen (when, prio, cat). */
function nbParse(raw, tab){
  let text = String(raw || '').replace(/\s+/g, ' ').trim();
  const bang = /^!+|!+$/.test(text) && !!text.replace(/!/g, '').trim();
  const prio = bang && !NB.off.has('prio');
  if(prio) text = text.replace(/^!+\s*/, '').replace(/\s*!+$/, '').trim();
  const w = nbWhen(text), found = !!(w.date || w.time), use = found && !NB.off.has('when');
  if(use && w.time && !w.date){ const n = new Date(); w.date = w.time > pad(n.getHours()) + ':' + pad(n.getMinutes()) ? todayISO() : addDays(todayISO(), 1); }
  const kind = (use || tab !== 'irgendwann') ? 'anstehend' : 'irgendwann';
  const cat = nbCatOf(text, kind);
  return {text, kind, prio, date:kind === 'anstehend' && use ? w.date : null, time:kind === 'anstehend' && use ? (w.time || '') : '', cat:cat && !NB.off.has('cat') ? cat : '', det:{prio:bang, when:found ? w : null, cat}};
}
/* Erkannte Angaben als Chips unter dem Eingabefeld. Tippen auf einen Chip ignoriert die Erkennung. */
function nbHint(){
  const h = $('#qaHint'), el = $('#qa'); if(!h || !el) return;
  let html = '';
  if(!el.value.trim()){
    NB.off.clear();
    if(document.activeElement === el) html = `<span class="nb-ex">${curTab('notizen') === 'irgendwann' ? 'Mit Datum geht es nach Anstehend · <b>!</b> = wichtig' : '<b>morgen</b> · <b>Fr</b> · <b>12.11.</b> · <b>18 Uhr</b> · <b>!</b> = wichtig'}</span>`;
  } else {
    const tab = curTab('notizen'), p = nbParse(el.value, tab), d = p.det, c = [];
    const chip = (k, inner, title) => `<button type="button" class="nb-qc nb-keep${NB.off.has(k) ? ' off' : ''}" data-action="nbOff" data-k="${k}" aria-pressed="${!NB.off.has(k)}" title="${esc(title)}">${inner}</button>`;
    if(d.when){ const w = Object.assign({}, d.when); if(!w.date && p.date) w.date = p.date; c.push(chip('when', ic('calendar') + esc(nbWhenLabel(w)), 'Datum ignorieren')); }
    if(d.prio) c.push(chip('prio', ic('flame') + 'Wichtig', 'Nicht als wichtig markieren'));
    if(d.cat) c.push(chip('cat', nbDot(d.cat) + esc(nbCatLabel(d.cat)), 'Bereich nicht zuordnen'));
    if(p.kind !== tab) c.push(`<span class="nb-qc to">${ic('arrow', 2)}${p.kind === 'anstehend' ? 'Anstehend' : 'Irgendwann'}</span>`);
    else if(p.kind === 'anstehend' && !p.date) c.push(`<span class="nb-qc to">Ohne Datum</span>`);
    html = c.join('');
  }
  if(h._html !== html){ h.innerHTML = html; h._html = html; }
}

const nbGroup = (n, today, nws, nwe) => !n.date ? 'none' : n.date < today ? 'late' : n.date === today ? 'today' : n.date === addDays(today, 1) ? 'tomorrow' : n.date < nws ? 'week' : n.date < nwe ? 'next' : 'later';
function noteRow(n, o={}){
  const meta = [], g = o.grp || '';
  if(n.done){ if(n.doneAt && g !== 'today') meta.push(`<span>${esc(nbDoneLabel(n.doneAt))}</span>`); }
  else if(n.kind === 'anstehend' && n.date){
    const when = g === 'today' || g === 'tomorrow' ? '' : relDay(n.date);
    const s = [when, n.time ? n.time + ' Uhr' : ''].filter(Boolean).join(' · ');
    if(s) meta.push(`<span class="${g === 'late' ? 'late' : g === 'today' ? 'due' : ''}">${esc(s)}</span>`);
  }
  if(n.cat && !o.hideCat && nbCatLabel(n.cat)) meta.push(`<span class="pill">${nbDot(n.cat)}${esc(nbCatLabel(n.cat))}</span>`);
  if(n.repeat && NB_STEP[n.repeat] && !n.done) meta.push(`<span class="nb-rep">${ic('refresh')}${esc(NB_REPEAT.find(r => r[0] === n.repeat)[1])}</span>`);

function nbDoneLabel(ts){ const d = String(ts).slice(0, 10), n = daysBetween(d, todayISO()); return n === 0 ? 'Heute erledigt' : n === 1 ? 'Gestern erledigt' : 'Erledigt am ' + fmtShort(d); }
/* Bereichs-Filter: nur wenn mehr als ein Bereich vorkommt. */
function nbFilter(name, list, cats){
  const keyOf = n => n.cat && nbCatLabel(n.cat) ? n.cat : 'ohne';
  const counts = {alle:list.length}; list.forEach(n => { const k = keyOf(n); counts[k] = (counts[k] || 0) + 1; });
  const used = [...cats, ...[...NOTE_CATS, ...SOMEDAY_CATS].filter(c => !cats.some(x => x[0] === c[0]))].filter(([k]) => counts[k]);
  const opts = [['alle','Alle'], ...used, ...(counts.ohne ? [['ohne','Ohne']] : [])];
  let f = S.f[name] || 'alle'; if(!counts[f]) f = 'alle';
  const bar = opts.length > 2 ? `<div class="toolbar nb-bar">${chipRow(name, opts, f, counts, NB_COL)}</div>` : '';
  return {bar, f, list:f === 'alle' ? list : list.filter(n => keyOf(n) === f)};
}
function notesUpcoming(){
  const today = todayISO(), ws = weekStart(today), nws = addDays(ws, 7), nwe = addDays(ws, 14);
  const all = openNotes().filter(n => n.kind === 'anstehend').sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999') || (a.time || '99').localeCompare(b.time || '99') || (a.prio === 'hoch' ? 0 : 1) - (b.prio === 'hoch' ? 0 : 1) || (b.createdAt || '').localeCompare(a.createdAt || ''));
  if(!all.length) return `<div class="nb-empty">${empty('calendar', 'Nichts geplant', 'Tipp oben ein, was ansteht. Datum und Uhrzeit werden erkannt.')}</div>` + nbHowTo('anstehend');

/* Nur plausible Werte gehen in Schnitt und Verlauf ein (Note 0,7–6,3, Punkte 0–15). */
const lrValid = g => { const v = Number(g.fields.value); return isFinite(v) && (lrScaleOf(g) === 'punkte' ? v >= 0 && v <= 15 : v >= .5 && v <= 6.5); };
const lrAvg = a => { a = a.filter(lrValid); return a.length ? a.reduce((s, g) => s + Number(g.fields.value), 0) / a.length : null; };

function lrValLabel(v, sc){
  if(sc === 'punkte') return v + ' P';

}

/* Fächer: zuerst die, die du benutzt, dann die üblichen. */
function lrUsed(){
  const c = {}, add = (s, w=1) => { s = String(s || '').trim(); if(s) c[s] = (c[s] || 0) + w; };
  S.exams.forEach(e => add(e.subject)); lrGrades().forEach(g => add(g.fields.subject)); lrFeyn().forEach(e => add(e.fields && e.fields.subject, .5));
  return Object.keys(c).sort((a, b) => c[b] - c[a] || a.localeCompare(b, 'de'));
}
const lrSubjects = (n=6) => [...new Set([...lrUsed(), ...LR_POP, ...SUBJECTS])].slice(0, n);
function lrCanon(s){
  s = String(s || '').trim().replace(/\s+/g, ' '); if(!s) return '';
  const k = s.toLowerCase(), hit = [...lrUsed(), ...SUBJECTS].find(x => x.toLowerCase() === k) || LR_ALIAS[k];
  return hit || s.charAt(0).toUpperCase() + s.slice(1);
}
function lrSubjOf(tok){
  const t = String(tok || '').toLowerCase().replace(/[^a-zäöüß]/g, ''); if(t.length < 2) return '';
  const exact = [...lrUsed(), ...SUBJECTS].find(s => s.toLowerCase() === t); if(exact) return exact;
  if(LR_ALIAS[t]) return LR_ALIAS[t];
  if(t.length >= 4){ const p = SUBJECTS.filter(s => s.toLowerCase().startsWith(t)); if(p.length === 1) return p[0]; }
  return '';
}

function planSessions(date, prev=[]){
  const today = todayISO(), D = daysBetween(today, date);
  let out = EXAM_PLAN.filter(([d]) => d <= D).map(([d, label]) => ({date:addDays(date, -d), label, done:false}));
  if(D >= 1 && (!out.length || (out[0].date > today && D <= 14))) out.unshift({date:today, label:'Start: Überblick verschaffen und erste Abfragerunde', done:false});
  out.forEach(s => { const p = prev.find(x => x.label === s.label); if(p && p.done) s.done = true; });
  return out;
}
const lrExamGrade = e => lrGrades().find(g => g.fields.examId === e.id) || lrGrades().find(g => !g.fields.examId && g.fields.subject === e.subject && lrDate(g) === e.date);

/* Schnell-Eingabe: „Mathe am Freitag Brüche“ → Fach, Datum, Thema. */
function lrParseExam(text){
  const raw = String(text || '').trim().replace(/([a-zäöüß])-(?=(?:klassenarbeit|arbeit|test|klausur|ka|prüfung)(?:$|[^a-zäöüß]))/gi, '$1 ');
  const w = parseWhen(raw), when = !!(w.date || w.time);
  const DROP = ['heute','heut','morgen','übermorgen','uebermorgen','nächste','nächsten','naechste','naechsten','kommende','kommenden','diese','diesen','woche', ...WD];
  const PREP = ['am','ab','bis','nächsten','kommenden','diesen'];
  const KA = ['klassenarbeit','ka','klausur','arbeit','schulaufgabe','prüfung','pruefung'], TEST = ['test','kurztest','lzk'];
  const toks = raw.split(/\s+/).filter(Boolean), keep = [];
  let kind = '';
  for(let i = 0; i < toks.length; i++){
    const t = toks[i], l = t.toLowerCase().replace(/[.,:;!?]+$/, ''), nx = (toks[i + 1] || '').toLowerCase().replace(/[.,:;!?]+$/, '');
    if(/^[-–·:|]+$/.test(t)) continue;
    if(KA.includes(l)){ kind = kind || 'ka'; continue; }
    if(TEST.includes(l)){ kind = 'test'; continue; }
    if(when){
      if(/^\d{1,2}\.\d{1,2}\.?(\d{2,4})?$/.test(t.replace(/[,;]+$/, '')) || /^\d{1,2}:\d{2}$/.test(l)) continue;
      if(/^\d{1,2}$/.test(l) && ['tag','tage','tagen','woche','wochen','uhr'].includes(nx)){ i++; continue; }
      if(l === 'in' && /^\d{1,2}$/.test(nx)) continue;
      if(PREP.includes(l) || DROP.includes(l) || l === 'uhr' || l === 'um') continue;
      if(WDS.includes(l) && i > 0 && PREP.includes(toks[i - 1].toLowerCase())) continue;
    }
    keep.push(t.replace(/[,;:]+$/, ''));
  }
  let subject = '', known = false, si = keep.findIndex(t => lrSubjOf(t));
  if(si >= 0){ subject = lrSubjOf(keep[si]); known = true; keep.splice(si, 1); }
  else if(keep.length){ subject = lrCanon(keep.shift()); }
  while(keep.length && ['über','zu','zum','zur','thema','in'].includes(keep[0].toLowerCase())) keep.shift();
  return {subject, known, date:w.date || '', title:keep.join(' ').trim(), kind};
}
const lrExReady = p => p.known && p.date && p.date >= todayISO();
function lrExHint(v){
  if(!String(v || '').trim()) return '';
  const p = lrParseExam(v), b = [];
  b.push(p.subject ? `<span class="pill${p.known ? ' acc' : ''}">${esc(p.subject)}</span>` : '<span class="pill warn">Fach?</span>');
  if(p.kind) b.push(`<span class="pill">${esc(lrKind(p.kind))}</span>`);
  b.push(p.date ? `<span class="pill ${p.date < todayISO() ? 'bad' : 'acc'}">${esc(fmtDay(p.date))} · ${esc(lrIn(p.date))}</span>` : '<span class="pill warn">Datum?</span>');
  if(p.title) b.push(`<span class="pill">${esc(cut(p.title, 26))}</span>`);

/* ---------------- Video-Bibliothek ----------------
   Aufbau: oben Link-Eingabe (kompakt, Erklärung nur per Info-Knopf), dann „In Arbeit“, „Offen zum Anwenden“
   (Häkchen über alle Videos), dann die Bibliothek mit Suche, Themen-Filter und aufklappbaren Karten.
   Datenfelder (unverändert): url, videoId, title, channel, duration, topic, core, points, details, apply, quotes,
   caution, status, star, applied, note, createdAt, source ('auto' | 'chat' | 'manual'). */
const VD = {info:false, lastJob:null, lastErr:false, noteSeen:{}};
const vdDone = v => !v.status || v.status === 'done';
const vdLines = s => String(s || '').split('\n').map(x => x.replace(/^\s*(?:[-–•*]|\d+[.)])\s+/, '').trim()).filter(Boolean);
/* Link prüfen: '' = leer, null = ungültig, sonst normalisierter Link (ohne Schema wird https:// ergänzt). */
function vdUrl(s){
  const t = String(s || '').trim(); if(!t) return '';
  const u = /^https?:\/\//i.test(t) ? t : (/^[\w-]+(\.[\w-]+)+([/?#].*)?$/.test(t) ? 'https://' + t : '');
  return /^https?:\/\/[^\s/?#]+\.[^\s/?#]{2,}[^\s]*$/i.test(u) ? u : null;
}

function R_videos(){
  const add = videoAddHTML();
  if(!S.ready) return add + loading();
  const vids = S.videos, done = vids.filter(vdDone), queue = vids.filter(v => !vdDone(v)).sort(byNew);
  if(!vids.length) return add + `<div class="vd-empty">${empty('videos', 'Noch keine Videos', 'Link oben einfügen oder ein Video von Hand eintragen.', `<button class="btn" data-action="vdManual">${ic('edit')}Von Hand eintragen</button>`)}</div>`;
  const f = S.f.vtopic || 'Alle', q = (S.q.videos || '').trim().toLowerCase();
  const used = TOPICS.filter(([t]) => done.some(v => (v.topic || 'Sonstiges') === t)), star = done.filter(v => v.star).length;
  const opts = [['Alle','Alle'], ...(star ? [['__star','Vertiefen']] : []), ...(queue.length ? [['__queue','Warteschlange']] : []), ...used.map(([t]) => [t, t])];
  const counts = {Alle:done.length, __star:star, __queue:queue.length}, colors = {};
  used.forEach(([t, c]) => { counts[t] = done.filter(v => (v.topic || 'Sonstiges') === t).length; colors[t] = c; });
  let list = f === '__queue' ? queue : f === '__star' ? done.filter(v => v.star) : f === 'Alle' ? done : done.filter(v => (v.topic || 'Sonstiges') === f);
  list = [...list].sort(byNew);
  if(q) list = list.filter(v => [v.title, v.channel, v.core, (v.points || []).join(' '), (v.apply || []).join(' '), v.details, v.note, v.topic, v.url].join(' ').toLowerCase().includes(q));
  const p = paged('videos', list);
  /* In Arbeit: wartende oder fehlgeschlagene Zusammenfassungen. Das Video, das oben gerade läuft
     (oder dort mit Fehler steht), nicht doppelt zeigen. */
  const qs = queue.filter(v => !(VJ.job && VJ.job.id === v.id));
  const qb = qs.length && f !== '__queue' ? `<div class="group-h">In Arbeit <b>${qs.length}</b></div><div class="list">${qs.slice(0, 3).map(queueCard).join('')}</div>${qs.length > 3 ? `<div class="more"><button class="btn sm" data-action="filter" data-name="vtopic" data-v="__queue">Alle ${queue.length} anzeigen</button></div>` : ''}` : '';
  const todo = f === 'Alle' && !q ? vdTodoHTML(done) : '';
  if(!done.length && f !== '__queue') return add + qb + todo;
  const showSearch = done.length >= 5 || q, showChips = opts.length > 2;
  /* Suche von außen zurückgesetzt (Zurücksetzen, neues Video)? Dann nicht den alten Feldinhalt zurückholen. */
  const qi = $('#q_videos'), qFresh = qi && qi.value !== (S.q.videos || '') ? ' data-fresh-value' : '';

  const head = `<div class="group-h">${f === '__queue' ? 'Warteschlange' : 'Bibliothek'} <b>${f === '__queue' ? queue.length : done.length}</b></div>`;
  return add + qb + todo + head + bar +
    (list.length ? `<div class="list">${p.items.map(v => vdDone(v) ? videoCard(v) : queueCard(v)).join('')}</div>${p.more}`
      : empty('search', 'Nichts gefunden', 'Probier eine andere Suche oder einen anderen Filter.', `<button class="btn sm" data-action="vdReset">${ic('x')}Filter zurücksetzen</button>`));
}

/* ---------------- Denkwerkzeuge ----------------
   Tabs: ziele · entscheidungen · notizen · wissen (Kern)
   Aufbau je Tab: oben eintragen, darunter die Einträge, Erklärungen nur eingeklappt. */

/* ---------- Daten-Hilfen ---------- */
const DK_MAX = 10;
const DK_VERDICT = [['gut','Gut entschieden'],['teils','Teils, teils'],['anders','Würde ich anders machen']];
const dkSafe = t => typeof t === 'string' && t && !/["<>&]/.test(t);
const DK_MODELS = (LIB.modelle || []).filter(x => x.cat === 'Entscheiden' || x.t === 'Inversion' || x.t === 'Pre-Mortem').map(x => x.t).filter(dkSafe).map(t => [t, t]);
const DK_BIAS = (LIB.denkfehler || []).map(x => x.t).filter(dkSafe).map(t => [t, t]);
const dkAreaLabel = k => (GOAL_AREAS.find(a => a[0] === k) || [0, ''])[1];
const dkGoals = () => S.goals.filter(g => g.kind !== 'spar');
const dkReached = g => g.status === 'erreicht' || !!g.done;
/* Etappen mit ihrem Index im gespeicherten Array (leere Einträge werden übersprungen). */
const dkSteps = g => (Array.isArray(g.steps) ? g.steps : []).map((x, i) => ({x, i})).filter(o => o.x && String(o.x.text || '').trim());
const dkClean = arr => (Array.isArray(arr) ? arr : []).filter(x => x && String(x.text || '').trim()).map(x => ({text:String(x.text).trim(), ok:!!x.ok}));
const dkNotes = () => { const types = AREA_NOTE_TYPES.denken || []; return S.entries.filter(e => e.area === 'denken' && (!e.type || e.type === 'notiz' || types.some(t => t[0] === e.type))); };
const dkDate = s => { const d = parseISO(s); return d.toLocaleDateString('de-DE', d.getFullYear() === new Date().getFullYear() ? {day:'numeric', month:'short'} : {day:'numeric', month:'short', year:'numeric'}); };
function dkDue(deadline){
  const n = daysBetween(todayISO(), deadline);
  if(n < 0) return ['late', 'Frist vorbei'];
  if(n === 0) return ['due', 'Frist heute'];
  if(n === 1) return ['due', 'Frist morgen'];
  if(n <= 14) return ['due', `noch ${n} Tage`];
  if(n <= 60) return ['faint', `noch ${n} Tage`];
  return ['faint', 'bis ' + dkDate(deadline)];
}
const dkDecState = (d, today) => d.outcome ? 'done' : d.reviewOn && d.reviewOn <= today ? 'due' : 'open';
function dkLibLink(libKey, title, label){
  const i = (LIB[libKey] || []).findIndex(x => x.t === title); if(i < 0) return '';
  return `<button class="dk-link" type="button" data-action="dkLib" data-w="${libKey}" data-card="${libKey}-${i}">${ic('book')}<span>${esc(label)}: <b>${esc(title)}</b></span></button>`;
}
function dkAreaDef(){ const f = S.f.dkArea; if(f && f !== 'alle') return f; const l = store.get('dk-area', ''); return GOAL_AREAS.some(a => a[0] === l) ? l : ''; }

/* Datums-Kürzel für Frist und Auswertung (ergänzt die Kern-Kürzel, ohne sie zu ändern). */
const DK_Q = (() => {
  try{
    DQ.dkReview = [['In 2 Wochen',14],['In 1 Monat',30],['In 3 Monaten',91]];
    Object.defineProperty(DQ, 'dkGoal', {configurable:true, enumerable:true, get(){
      const t = todayISO(), end = daysBetween(t, t.slice(0, 4) + '-12-31');
      const q = [['In 1 Monat',30],['In 3 Monaten',91],['In 6 Monaten',182]];
      if(end > 14 && ![30, 91, 182].includes(end)) q.push(['Jahresende', end]);
      return q.sort((a, b) => a[1] - b[1]);
    }});
    return true;
  }catch(e){ return false; }
})();

      {id:'premortem', type:'area', label:'Pre-Mortem', hint:'Warum könnte es schiefgehen?', rows:2, opt:true, group:'more'},
      {id:'second', type:'area', label:'Und was passiert danach?', hint:'Folgen zweiter Ordnung', rows:2, opt:true, group:'more'},
      {id:'expect', type:'text', label:'Deine Erwartung', opt:true, group:'more', ph:'Was wird deiner Meinung nach passieren?'},

  review:{ col:'decisions', area:'denken', noEdit:true, title:it => it && it.outcome ? 'Auswertung bearbeiten' : 'Entscheidung auswerten',

    fields:[

    ],
    tabOf:() => 'entscheidungen',

    save: async (v, it) => { await dbUpd('decisions', it.id, {outcome:v.outcome.trim(), verdict:v.verdict || '', lesson:(v.lesson || '').trim(), bias:v.bias || '', reviewedAt:it.reviewedAt || nowISO()}); return it.id; }}
});
/* Beim Auswerten: Frage, Wahl und Erwartung von damals oben im Formular zeigen. */

const dkFold = (k, label, n, extra='') => `<button class="fold dk-fold${extra}" data-action="dkFold" data-k="${k}" aria-expanded="${S.open.has(k)}"><span>${esc(label)} <b>${n}</b></span>${ic('chev')}</button>`;

/* ---------- Ziele ---------- */
function goalsHTML(){
  const bar = quickBar({id:'dk_qg', ph:'Neues Ziel …', action:'dkGoalAdd', btn:'Anlegen', max:120});
  if(!S.ready) return bar + `<div class="dk-gap">${loading()}</div>`;
  const all = dkGoals();
  const how = `<div class="dk-how">${howTo('So funktioniert’s', `<ol><li>Ziel oben eintippen und anlegen. Die Etappen ergänzt du direkt auf der Karte. Bereich, Frist und Messgröße gibt es über „Neues Ziel“.</li><li>Etappen sind konkrete Schritte. Die nächste offene steht immer auf der Karte, ein Tipp hakt sie ab.</li><li>Sind alle geschafft, markierst du das Ziel als erreicht. Erreichte Ziele liegen eingeklappt darunter.</li></ol>`)}</div>`;
  if(!all.length) return bar + `<div class="dk-gap">${empty('denken', 'Noch kein Ziel', 'Ein Ziel, ein paar Etappen – mehr braucht es nicht.', `<button class="btn primary" data-action="fab" data-form="goal">${ic('plus')}Ziel mit Etappen anlegen</button>`)}</div>` + how;
  const counts = {alle:all.length}; GOAL_AREAS.forEach(([k]) => { counts[k] = all.filter(g => g.area === k).length; });
  const used = GOAL_AREAS.filter(([k]) => counts[k]);
  let f = S.f.dkArea || 'alle'; if(f !== 'alle' && !counts[f]) f = 'alle';
  const L = f === 'alle' ? all : all.filter(g => g.area === f);
  const active = L.filter(g => !dkReached(g)).sort((a, b) => (a.deadline || '9999').localeCompare(b.deadline || '9999') || byNew(a, b));
  const reached = L.filter(dkReached).sort((a, b) => (b.doneAt || b.createdAt || '').localeCompare(a.doneAt || a.createdAt || ''));
  const st = active.flatMap(g => dkSteps(g)), sd = st.filter(o => o.x.ok).length;
  const stats = `<div class="dk-stats"><div><b>${active.length}</b><span>Aktiv</span></div><div><b>${st.length ? `${sd}<small>/${st.length}</small>` : '–'}</b><span>Etappen</span></div><div><b>${reached.length}</b><span>Erreicht</span></div></div>`;
  const filter = used.length > 1 || (used.length === 1 && counts[used[0][0]] < all.length) ? `<div class="toolbar dk-tools">${chipRow('dkArea', [['alle','Alle'], ...used], f, counts)}</div>` : '';
  const ropen = S.open.has('dk-reached'), pop = S.dkPop && Date.now() - S.dkPop < 2500 ? ' dk-pop' : '';
  const body = active.length ? `<div class="list dk-glist">${active.map(goalCard).join('')}</div>` : `<div class="dk-none">${ic('check')}<span>Kein aktives Ziel${f !== 'alle' ? ' in diesem Bereich' : ''}. Leg oben ein neues an.</span></div>`;
  const rpart = reached.length ? dkFold('dk-reached', 'Erreicht', reached.length, pop) + (ropen ? `<div class="list dk-glist dk-rlist" id="dk_dk-reached">${reached.map(goalCard).join('')}</div>` : '') : '';
  return bar + `<div class="dk-gap">${filter}${stats}</div>` + `<div class="dk-gap">${body}</div>` + rpart + how;
}
function goalCard(g){
  const key = 'g-' + g.id, open = S.open.has(key), reached = dkReached(g), st = dkSteps(g), done = st.filter(o => o.x.ok).length, n = st.length;
  const next = st.find(o => !o.x.ok), area = dkAreaLabel(g.area);
  const p = n ? Math.round(done / n * 100) : reached ? 100 : 0;
  const ring = `<span class="dk-ring${reached ? ' won' : ''}" style="--dk-p:${p}" aria-hidden="true"><b>${reached ? ic('check', 2.6) : n ? `${done}/${n}` : '–'}</b></span>`;
  const kick = [];
  if(area) kick.push(`<span class="pill">${esc(area)}</span>`);
  if(reached) kick.push(`<span class="pill ok">${ic('trophy')}Erreicht${g.doneAt ? ' ' + esc(dkDate(String(g.doneAt).slice(0, 10))) : ''}</span>`);
  else if(g.deadline){ const [c, t] = dkDue(g.deadline); kick.push(`<span class="${c}">${esc(t)}</span>`); }
  if(!reached && !n) kick.push('<span class="faint">Ohne Etappen</span>');
  let nx = '';
  if(!reached){
    if(next) nx = `<div class="dk-next${S.dkIn === g.id ? ' dk-in' : ''}"><button class="chk dk-step" data-action="dkStep" data-id="${g.id}" data-i="${next.i}" aria-pressed="false"><span class="box">${ic('check', 3)}</span><span class="l"><small>Nächste Etappe</small>${esc(next.x.text)}</span></button></div>`;
    else if(n) nx = `<div class="dk-next${S.dkIn === g.id ? ' dk-in' : ''}"><button class="btn sm primary" data-action="dkReach" data-id="${g.id}">${ic('trophy')}Alle Etappen geschafft · Erreicht</button></div>`;
    else nx = `<div class="dk-next"><button class="dk-first" data-action="dkFirst">${ic('plus', 2.2)}Erste Etappe festlegen</button></div>`;
  }
  const steps = n ? `<div class="applied dk-steps">${st.map(o => reached
      ? `<div class="chk" aria-pressed="${!!o.x.ok}"><span class="box">${ic('check', 3)}</span><span class="l">${esc(o.x.text)}</span></div>`
      : `<button class="chk dk-step" data-action="dkStep" data-id="${g.id}" data-i="${o.i}" aria-pressed="${!!o.x.ok}"><span class="box">${ic('check', 3)}</span><span class="l">${esc(o.x.text)}</span></button>`).join('')}</div>` : '';
  const add = !reached && n < DK_MAX ? `<div class="dk-add"><input class="txt" id="dk_st_${g.id}" placeholder="${n ? 'Weitere Etappe' : 'Erste Etappe, z. B. Plan für diese Woche'}" maxlength="120" autocomplete="off" enterkeyhint="done" data-enter="dkStepAdd" data-id="${g.id}" aria-label="Etappe hinzufügen"><button class="icon-btn sm" type="button" data-action="dkStepAdd" data-id="${g.id}" aria-label="Etappe hinzufügen">${ic('plus', 2.2)}</button></div>` : '';
  const info = (g.why ? blk('Warum', `<p>${esc(g.why)}</p>`) : '') + (g.measure ? blk('Geschafft, wenn …', `<p>${esc(g.measure)}</p>`) : '');
  const acts = `<div class="actions">${reached ? `<button class="btn sm" data-action="dkReach" data-id="${g.id}">${ic('refresh')}Wieder aktiv</button>` : `<button class="btn sm${n && done === n ? ' primary' : ''}" data-action="dkReach" data-id="${g.id}">${ic('trophy')}Erreicht</button>`}<button class="btn sm" data-action="edit" data-form="goal" data-col="goals" data-id="${g.id}">${ic('edit')}Bearbeiten</button><button class="btn sm ghost" data-action="del" data-col="goals" data-id="${g.id}" aria-label="Ziel löschen">${ic('trash')}</button></div>`;
  return `<article class="card dk-goal${reached ? ' dk-won' : ''}${open ? ' open' : ''}${freshCls('goals', g.id)}" data-key="${key}"><button class="card-h" data-action="card" aria-expanded="${open}">${ring}<span class="ct">${kick.length ? `<span class="kick">${kick.join('')}</span>` : ''}<span class="h">${esc(g.title || 'Ziel')}</span></span><span class="chev">${ic('chev', 2)}</span></button>${nx}
    <div class="card-b"><div><div class="inner">${steps}${add}${info}${g.deadline && !reached ? `<p class="dk-meta">${ic('calendar')}Frist: ${esc(fmtLong(g.deadline))}</p>` : ''}${acts}</div></div></div></article>`;
}

/* ---------- Entscheidungen ---------- */
function decisionsHTML(){
  const bar = quickBar({id:'dk_qd', ph:'Was entscheidest du?', action:'dkDecStart', btn:'Durchdenken', max:160});
